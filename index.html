<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gölge Ağı v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#000;color:#e6edf7;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit}
#matrix{position:absolute;inset:0;z-index:1;opacity:.7}
.app{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;background:rgba(0,0,0,.55);overflow:hidden}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0px,rgba(0,0,0,.12) 1px,transparent 1px,transparent 3px)}
.head{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid rgba(51,255,102,.35);background:rgba(0,0,0,.4);flex-wrap:wrap;gap:10px;flex-shrink:0;z-index:10;position:relative}
.head-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.head-tag{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:#33ff66;font-weight:700}
.head-tag svg{width:14px;height:14px;flex-shrink:0}
.rec-dot{width:8px;height:8px;border-radius:50%;background:#ff3355;box-shadow:0 0 8px #ff3355;animation:recblink 1.2s infinite}
@keyframes recblink{50%{opacity:.3}}
.stat-group{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px}
.stat svg{width:14px;height:14px}
.stat .lbl{color:#6b8fad;font-size:10px}
.stat .val{color:#33ff66;font-weight:700}
.stat.warn .val{color:#ffcc33}
.stat.danger .val{color:#ff3355}
.head-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hbtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(51,255,102,.4);border-radius:6px;font-size:11px;letter-spacing:1.5px;color:#33ff66;font-weight:600;font-family:'JetBrains Mono',monospace;transition:.15s;position:relative}
.hbtn svg{width:14px;height:14px;flex-shrink:0}
.hbtn:hover{background:rgba(51,255,102,.12);border-color:#33ff66}
.hbtn.alert{border-color:#ff3355;color:#ff3355;background:rgba(255,51,85,.08);animation:alertpulse 1.4s infinite}
.hbtn.active{border-color:#ffff66;color:#ffff66;background:rgba(255,255,102,.1)}
.hbtn .badge{position:absolute;top:-6px;right:-6px;background:#ff3355;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@keyframes alertpulse{50%{background:rgba(255,51,85,.25)}}
.timer-ring{display:none;align-items:center;gap:8px;padding:4px 10px;border:1px solid rgba(255,255,102,.4);border-radius:8px;background:rgba(255,255,102,.06)}
.timer-ring.on{display:flex}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring .tval{font-family:'JetBrains Mono',monospace;font-size:13px;color:#ffff66;font-weight:700;min-width:42px}
.timer-ring.warn{border-color:#ffcc33}.timer-ring.warn .tval{color:#ffcc33}
.timer-ring.danger{border-color:#ff3355;animation:alertpulse .8s infinite}.timer-ring.danger .tval{color:#ff3355}
.timer-ring .ring-bg{stroke:rgba(255,255,102,.15)}
.timer-ring .ring-fg{stroke:#ffff66;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.timer-ring.warn .ring-fg{stroke:#ffcc33}.timer-ring.danger .ring-fg{stroke:#ff3355}
.lang-switcher{display:flex;gap:3px;padding:3px;background:rgba(0,0,0,.45);border:1px solid rgba(51,255,102,.3);border-radius:8px}
.lang-btn{padding:4px 10px;font-size:11px;font-weight:700;color:#6b8fad;border-radius:6px;transition:.15s;font-family:'JetBrains Mono',monospace;letter-spacing:1px;cursor:pointer}
.lang-btn:hover{color:#33ff66;background:rgba(51,255,102,.1)}
.lang-btn.active{color:#06121c;background:#33ff66}
.main{flex:1;display:flex;overflow:hidden;position:relative;z-index:5;min-height:0}
.term{flex:1;display:flex;flex-direction:column;padding:14px 18px;min-width:0;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;color:#33ff66;text-shadow:0 0 5px rgba(51,255,102,.35)}
#hackLog{flex:1;overflow-y:auto;padding-right:8px;min-height:0}
#hackLog::-webkit-scrollbar{width:6px}
#hackLog::-webkit-scrollbar-thumb{background:rgba(51,255,102,.4);border-radius:3px}
#hackLog .l{margin-bottom:1px;white-space:pre-wrap;word-break:break-word}
.warn{color:#ffcc33}.err{color:#ff3355}.info{color:#33ccff}.sys{color:#888}
.ok{color:#33ff66;font-weight:700}.hl{color:#ffff66;font-weight:700}
.dir{color:#33aaff;font-weight:700}.prompt{color:#33ff66;font-weight:700}
#hackLog .mission-box{border-left:3px solid #33ff66;padding:8px 12px;margin:10px 0;background:linear-gradient(90deg,rgba(51,255,102,.08),transparent);border-radius:0 8px 8px 0;display:block}
#hackLog .mission-box .mh{color:#ffff66;font-weight:700;display:flex;align-items:center;gap:6px}
#hackLog .mission-box .mr{color:#33ccff;font-size:12px;margin-top:2px}
#hackLog .brief{border:1px solid rgba(255,204,51,.4);background:rgba(255,204,51,.05);padding:12px 16px;margin:12px 0;border-radius:8px;display:block;line-height:1.7}
#hackLog .brief b{color:#ffff66}
#hackLog .step-row{display:flex;gap:8px;padding:3px 0;align-items:baseline}
#hackLog .step-row .n{color:#6b8fad;min-width:22px}
#hackLog .step-row .c{color:#33ccff;font-weight:700}
#hackLog .step-row .d{color:#8fa3c0;font-size:11.5px}
.input-row{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(51,255,102,.35);padding-top:10px;margin-top:8px;flex-shrink:0;position:relative}
.input-row .pr{color:#33ff66;font-weight:700;white-space:nowrap}
.input-row .mis-tag{color:#ffff66;font-size:10.5px;padding:3px 8px;border:1px solid rgba(255,255,102,.4);border-radius:5px;background:rgba(255,255,102,.08);white-space:nowrap;display:none;font-weight:700;letter-spacing:1px;align-items:center;gap:4px}
.input-row .mis-tag.on{display:inline-flex}
.input-row .mis-tag svg{width:12px;height:12px}
#hackInput{flex:1;background:transparent;border:none;outline:none;color:#33ff66;font-family:inherit;font-size:13px;caret-color:#33ff66;min-width:0}
.side{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:100%;z-index:30;background:rgba(3,8,6,.98);backdrop-filter:blur(16px);border-left:1.5px solid rgba(51,255,102,.35);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.side.open{transform:translateX(0)}
.side.mis{border-left-color:rgba(255,51,85,.5);background:rgba(10,3,6,.98)}
.side.ach{border-left-color:rgba(167,139,250,.5);background:rgba(5,3,12,.98)}
.side.news{border-left-color:rgba(34,211,238,.5);background:rgba(3,8,12,.98)}
.side-head{padding:16px 22px;border-bottom:1px solid rgba(51,255,102,.25);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-shrink:0}
.side-head h2{font-size:13px;letter-spacing:3px;font-weight:700;display:flex;align-items:center;gap:10px}
.side-head h2 svg{width:18px;height:18px}
.side-head .ico-red{color:#ff3355}.side-head .ico-green{color:#33ff66}
.side-head .ico-purple{color:#a78bfa}.side-head .ico-cyan{color:#22d3ee}
.side-head button{padding:6px 12px;border:1px solid rgba(150,150,150,.4);border-radius:6px;font-size:11px;letter-spacing:1.5px;color:#c6d4e6;font-family:inherit}
.side-search{padding:10px 22px;border-bottom:1px solid rgba(150,150,150,.15)}
.side-search input{width:100%;padding:9px 14px;background:rgba(10,20,15,.8);border:1.5px solid rgba(51,255,102,.3);border-radius:8px;color:#33ff66;font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:none}
.side-body{flex:1;overflow-y:auto;padding:14px 20px 30px}
.mis-card{background:linear-gradient(135deg,rgba(25,10,15,.9),rgba(15,5,8,.9));border:1px solid rgba(255,51,85,.25);border-radius:14px;padding:14px;margin-bottom:12px;transition:.2s;position:relative;overflow:hidden}
.mis-card:hover{border-color:rgba(255,51,85,.6)}
.mis-card.active{border-color:#ffff66;background:linear-gradient(135deg,rgba(35,30,5,.95),rgba(20,15,3,.95))}
.mis-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.mis-avatar{width:48px;height:48px;flex-shrink:0;background:rgba(0,0,0,.3);border-radius:12px;padding:4px;position:relative}
.mis-avatar svg{width:100%;height:100%;display:block}
.mis-avatar .type-dot{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center}
.mis-avatar .type-dot svg{width:10px;height:10px}
.mis-head-info{flex:1;min-width:0}
.mis-cli{font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:2px;text-transform:uppercase}
.mis-cli-type{color:#8fa3c0;font-size:10px;letter-spacing:1.5px}
.mis-title{font-size:14.5px;font-weight:700;color:#ffff66;line-height:1.3;margin-bottom:8px}
.mis-desc{font-size:12px;color:#c6d4e6;line-height:1.55;margin-bottom:10px}
.mis-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mis-meta .tag{padding:4px 8px;border-radius:6px;font-size:10px;letter-spacing:1px;font-weight:600;display:inline-flex;align-items:center;gap:4px;background:rgba(255,51,85,.12);border:1px solid rgba(255,51,85,.3);color:#ff8899}
.mis-meta .tag svg{width:11px;height:11px}
.mis-meta .tag.rew{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.3);color:#86efac}
.mis-meta .tag.risk{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.3);color:#fde047}
.mis-meta .tag.special{background:linear-gradient(90deg,rgba(255,51,85,.2),rgba(255,204,51,.2));border-color:#ffaa33;color:#ffcc88;animation:specialglow 1.6s infinite}
@keyframes specialglow{50%{box-shadow:0 0 12px rgba(255,170,51,.5)}}
.mis-steps{background:rgba(0,0,0,.35);border-radius:8px;padding:10px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px}
.mis-steps .sr{display:flex;gap:8px;align-items:baseline;padding:2px 0;color:#6b8fad}
.mis-steps .sr .sn{width:18px;color:#6b8fad;flex-shrink:0}
.mis-steps .sr .sc{color:#33ccff;font-weight:700}
.mis-steps .sr.done .sc{color:#33ff66;text-decoration:line-through;opacity:.5}
.mis-steps .sr.now .sc{color:#ffff66;text-shadow:0 0 6px #ffff66}
.mis-actions{display:flex;gap:8px}
.mis-actions button{flex:1;padding:9px 14px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:1.5px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'JetBrains Mono',monospace}
.mis-actions button svg{width:12px;height:12px}
.mis-actions .acc{background:#33ff66;color:#06121c}
.mis-actions .ref{background:transparent;border:1px solid rgba(255,51,85,.4);color:#ff8899}
.mis-actions .abt{background:rgba(255,51,85,.15);color:#ff8899;border:1px solid rgba(255,51,85,.4)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach-card{background:linear-gradient(135deg,rgba(30,20,50,.6),rgba(15,10,30,.6));border:1px solid rgba(167,139,250,.2);border-radius:12px;padding:12px;text-align:center;transition:.2s}
.ach-card.locked{opacity:.35;filter:grayscale(1)}
.ach-card.unlocked{border-color:rgba(167,139,250,.5);background:linear-gradient(135deg,rgba(40,25,70,.8),rgba(20,10,40,.8))}
.ach-icon{width:56px;height:56px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.ach-icon svg{width:100%;height:100%}
.ach-name{font-size:11.5px;font-weight:700;color:#e6edf7;margin-bottom:3px}
.ach-desc{font-size:10px;color:#8fa3c0;line-height:1.4}
.ach-card.unlocked .ach-name{color:#c4b5fd}
.news-ticker{background:rgba(3,10,15,.85);border-top:1.5px solid rgba(34,211,238,.3);padding:8px 16px;display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;flex-shrink:0;position:relative;z-index:8;overflow:hidden}
.news-ticker svg.live{width:14px;height:14px;color:#22d3ee;flex-shrink:0;animation:newspulse 2s infinite}
@keyframes newspulse{50%{opacity:.4}}
.news-scroll{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:16px}
.news-scroll .item{position:absolute;top:0;left:100%;display:inline-flex;gap:6px;align-items:center;animation:scrollnews 30s linear infinite}
@keyframes scrollnews{from{left:100%}to{left:-100%}}
.news-lbl{color:#22d3ee;font-weight:700;letter-spacing:2px;font-size:10px}
.news-item{background:rgba(10,20,30,.6);border-left:3px solid #22d3ee;border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px}
.news-item.bad{border-color:#ff3355}.news-item.good{border-color:#33ff66}
.news-item .cat{font-size:9.5px;letter-spacing:2px;color:#22d3ee;font-weight:700;margin-bottom:4px}
.news-item .headline{font-size:13.5px;font-weight:700;color:#e6edf7;margin-bottom:6px;line-height:1.35}
.news-item .body{font-size:11.5px;color:#8fa3c0;line-height:1.55}
.news-item .time{font-size:10px;color:#6b8fad;margin-top:6px;font-family:monospace}
#capture{position:fixed;inset:0;z-index:200;display:none;background:rgba(30,0,5,.97);backdrop-filter:blur(10px);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}
#capture.on{display:flex;animation:captureFade .5s}
@keyframes captureFade{from{opacity:0}to{opacity:1}}
#capture svg.big{width:min(280px,60vmin);height:min(280px,60vmin);filter:drop-shadow(0 0 40px #ff3355)}
#capture h1{font-size:42px;font-weight:900;color:#ff3355;letter-spacing:6px;margin-top:20px;font-family:'JetBrains Mono',monospace;text-shadow:0 0 20px #ff3355;animation:captureBlink .8s infinite}
@keyframes captureBlink{50%{opacity:.4}}
#capture p{color:#ff8899;font-size:14px;margin-top:12px;max-width:500px;line-height:1.7;font-family:'JetBrains Mono',monospace}
#capture .stats{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap;justify-content:center}
#capture .st{background:rgba(0,0,0,.5);border:1px solid rgba(255,51,85,.4);padding:12px 20px;border-radius:10px;font-family:'JetBrains Mono',monospace}
#capture .st .l{font-size:10px;letter-spacing:2px;color:#ff8899}
#capture .st .v{font-size:22px;font-weight:800;color:#ff3355;margin-top:4px}
#capture button{margin-top:26px;padding:14px 30px;border-radius:10px;background:#ff3355;color:#fff;font-weight:800;letter-spacing:3px;font-family:'JetBrains Mono',monospace;font-size:14px;box-shadow:0 8px 30px rgba(255,51,85,.4)}
.toast{position:fixed;bottom:60px;right:20px;z-index:150;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{background:rgba(3,20,10,.95);border:1.5px solid #33ff66;border-radius:10px;padding:12px 18px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#33ff66;box-shadow:0 8px 30px rgba(51,255,102,.3);display:flex;align-items:center;gap:10px;animation:toastIn .4s;min-width:220px}
.toast-item svg{width:20px;height:20px;flex-shrink:0}
.toast-item.gold{border-color:#ffcc33;color:#ffcc33}
.toast-item.danger{border-color:#ff3355;color:#ff8899}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
#autocomplete{position:absolute;bottom:100%;left:0;right:0;background:rgba(2,10,5,.98);border:1px solid rgba(51,255,102,.4);border-radius:8px 8px 0 0;max-height:180px;overflow-y:auto;display:none;z-index:50;font-family:'JetBrains Mono',monospace;font-size:12px}
#autocomplete.on{display:block}
#autocomplete .item{padding:7px 14px;cursor:pointer;color:#8fa3c0;display:flex;justify-content:space-between;gap:12px}
#autocomplete .item.sel{background:rgba(51,255,102,.12);color:#33ff66}
#autocomplete .item .nm{font-weight:700}
#autocomplete .item .ds{font-size:10.5px;color:#6b8fad}
.sb-title{font-size:10px;letter-spacing:3px;color:#6b8fad;font-weight:700;margin-bottom:8px;text-transform:uppercase}
#realFsStatus{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:15;display:none;align-items:center;gap:8px;padding:6px 14px;background:rgba(3,20,10,.95);border:1.5px solid #33ff66;border-radius:20px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#33ff66;box-shadow:0 8px 24px rgba(51,255,102,.3);letter-spacing:1px;pointer-events:none}
#realFsStatus.on{display:flex}
#realFsStatus svg{width:14px;height:14px}
#realFsStatus .dot{width:6px;height:6px;border-radius:50%;background:#33ff66;box-shadow:0 0 8px #33ff66;animation:recblink 1.2s infinite}
html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
html[dir="rtl"] .head,html[dir="rtl"] .head-left,html[dir="rtl"] .head-btns,html[dir="rtl"] .stat-group,html[dir="rtl"] .input-row,html[dir="rtl"] .mis-top,html[dir="rtl"] .mis-actions{flex-direction:row-reverse}
html[dir="rtl"] .term{direction:rtl;text-align:right}
html[dir="rtl"] .side{right:auto;left:0;border-left:none;border-right:1.5px solid rgba(51,255,102,.35);transform:translateX(-100%)}
html[dir="rtl"] .side.open{transform:translateX(0)}
html[dir="rtl"] .toast{right:auto;left:20px}
html[dir="rtl"] .mission-box,html[dir="rtl"] .brief{border-left:none;border-right:3px solid #33ff66;padding-left:0;padding-right:12px;border-radius:8px 0 0 8px}
html[dir="rtl"] .news-item{border-left:none;border-right:3px solid #22d3ee;border-radius:10px 0 0 10px;text-align:right}
html[dir="rtl"] .mis-avatar .type-dot{right:auto;left:-2px}
@media(max-width:800px){.side{width:100%}.term{padding:10px 12px;font-size:12px}.head{padding:8px 12px}.stat{font-size:10px}.hbtn{padding:5px 9px;font-size:10px}#capture h1{font-size:26px}}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="app">
<div class="head">
<div class="head-left">
<div class="head-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h6M8 17h4"/></svg>ROOT@MAINFRAME</div>
<div class="rec-dot"></div>
<div class="stat-group">
<div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="#33ff66" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg><span class="lbl" data-i18n="stat_rep">REP</span><span class="val" id="statRep">0</span></div>
<div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="#33ff66" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9h5a2 2 0 010 4H9M9 13h6"/></svg><span class="lbl">$</span><span class="val" id="statMoney">0</span></div>
<div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="#33ff66" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span class="lbl" data-i18n="stat_done">DONE</span><span class="val" id="statDone">0</span></div>
<div class="stat warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg><span class="lbl" data-i18n="stat_wanted">WANTED</span><span class="val" id="statWanted">0★</span></div>
</div>
<div class="timer-ring" id="timerRing">
<svg width="26" height="26" viewBox="0 0 26 26"><circle class="ring-bg" cx="13" cy="13" r="11" fill="none" stroke-width="2.5"/><circle class="ring-fg" id="ringFg" cx="13" cy="13" r="11" fill="none" stroke-width="2.5" stroke-dasharray="69.115" stroke-dashoffset="0"/></svg>
<span class="tval" id="timerVal">--:--</span>
</div>
</div>
<div class="lang-switcher" id="langSwitcher">
<button class="lang-btn active" data-lang="tr">TR</button>
<button class="lang-btn" data-lang="en">EN</button>
<button class="lang-btn" data-lang="ar">AR</button>
</div>

let misCounter=0;
function makeMission(force){if(state.rep>=10)state.contacts.add("komiser_y");if(state.rep>=15)state.contacts.add("karga");if(state.rep>=20)state.contacts.add("golge");if(state.rep>=25)state.contacts.add("gazeteci");if(state.rep>=30)state.contacts.add("patron_v");if(state.rep>=40)state.contacts.add("avukat");if(state.rep>=60)state.contacts.add("doktor_k");let av=MISSION_TEMPLATES.filter(x=>state.contacts.has(x.client));if(force)av=av.filter(x=>x.client===force);if(!av.length)av=MISSION_TEMPLATES.filter(x=>state.contacts.has(x.client));if(!av.length)return null;const tp=rand(av);misCounter++;const target=`10.0.${randInt(0,5)}.${randInt(2,250)}`;const dm=1+Math.floor(state.rep/25)*0.15;const reward=Math.round((tp.reward+randInt(-200,400))*dm);let steps=tp.steps.map(s=>({cmd:s.cmd.replace(/{t}/g,target),d:s.d}));const baseTime=30+steps.length*8;const time=Math.round(baseTime/dm);const special=Math.random()<0.08;const fnames={hack:["credentials.dat","users.db"],steal:["vault_plan.vault","kasa.dat"],expose:["evidence.dat","kanit.dat"],corp:["contract.dat","sozlesme.dat"],chaos:["payload.bin","yuk.bin"]};const fname=rand(fnames[tp.type]||["data.dat"]);const insertAt=Math.min(2,steps.length-1);steps.splice(insertAt,0,{cmd:`download ${fname}`,d:t("mission_desc")||"Dosyayı indir",_fname:fname,_isDownload:true});return{id:"M"+String(misCounter).padStart(3,"0"),client:tp.client,type:tp.type,title:special?"⚡ "+tp.title:tp.title,desc:tp.desc,reward:special?reward*3:reward,rep:tp.rep,risk:tp.risk,time,special,target,steps,done:false,arrived:Date.now(),payloadFile:fname};}
function notifyMission(mis){const c=CONTACTS[mis.client];log("","");log({html:`<span class="mission-box"><span class="mh">${mis.special?"🔥":"📨"} ${t("new_mission")} — ${mis.id}</span><div class="mr"><b>${t("mission_from")}:</b> <span style="color:${c.color};font-weight:700">${c.emoji} ${clientName(mis.client)}</span></div><div class="mr"><b>${t("mission_subject")}:</b> ${escapeHtml(mis.title)}</div><div class="mr"><b>${t("mission_payment")}:</b> ${money(mis.reward)} · <b>${t("mission_rep")}:</b> +${mis.rep} · <b>${t("mission_time")}:</b> ${mis.time}s</div><div class="mr" style="color:#ffff66">→ accept ${mis.id} · refuse ${mis.id}</div></span>`});log("","");Audio2.mission();updateStats();addNews("mission",mis);}

function findMission(id){return state.inbox.find(m=>m.id.toLowerCase()===id.toLowerCase()&&!m.done);}
function acceptMission(id,fromPanel){const m=findMission(id);if(!m){log(`${id}: ${t("mission_not_found")}`,"err");Audio2.fail();return;}if(state.active){log(t("active_mission_exists"),"warn");return;}state.active=m;state.activeStep=0;state.timerRemaining=m.time;startTimer();if(fromPanel)closeSide("panelMissions");updateStats();renderMissions();showBriefing(m);Audio2.enter();}
function showBriefing(m){const c=CONTACTS[m.client];log("","");const sh=m.steps.map((s,i)=>`<div class="step-row ${i===0?'now':''}"><span class="n">${i+1}.</span><span class="c">${escapeHtml(s.cmd)}</span><span class="d">← ${escapeHtml(s.d)}</span></div>`).join("");log({html:`<span class="brief"><b>📋 ${t("mission_brief")} — ${m.id} ${m.special?t("mission_special"):""}</b><br><b>${t("mission_client")}:</b> <span style="color:${c.color}">${c.emoji} ${clientName(m.client)}</span> · ${clientType(m.client)}<br><b>${t("mission_target")}:</b> ${m.target} · <b>${t("mission_city")}:</b> ${t("city_"+c.city)}<br><b>${t("mission_payment")}:</b> ${money(m.reward)} · <b>${t("mission_rep")}:</b> +${m.rep} · <b>${t("mission_time")}:</b> ${m.time}s<br><br><b>${t("mission_desc")}:</b><br>${escapeHtml(m.desc)}<br><br><b>${t("mission_steps")}:</b>${sh}<br><span style="color:#ffff66">${t("mission_hint")}</span></span>`});log("","");log({html:`<span class="ok">${t("mission_first_cmd")}: <b>${escapeHtml(m.steps[0].cmd)}</b></span>`});log("","");}
function startTimer(){clearInterval(state.timerInterval);const ring=$("#timerRing");ring.classList.add("on");const upd=()=>{const pct=state.timerRemaining/state.active.time;const circ=2*Math.PI*11;$("#ringFg").setAttribute("stroke-dashoffset",circ*(1-pct));const mm=Math.floor(state.timerRemaining/60),ss=state.timerRemaining%60;$("#timerVal").textContent=`${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;ring.classList.toggle("warn",pct<=0.5&&pct>0.25);ring.classList.toggle("danger",pct<=0.25);};upd();state.timerInterval=setInterval(()=>{state.timerRemaining--;if(state.timerRemaining<=5&&state.timerRemaining>0)Audio2.tick();if(state.timerRemaining<=0){clearInterval(state.timerInterval);timeUp();return;}upd();},1000);}
function stopTimer(){clearInterval(state.timerInterval);$("#timerRing").classList.remove("on","warn","danger");}
async function timeUp(){const m=state.active;if(!m)return;log("","");log(t("time_up"),"err");log("  "+t("police_traced"),"err");state.wanted=Math.min(10,state.wanted+2);state.rep=Math.max(0,state.rep-Math.floor(m.rep/2));state.streak=0;m.done=true;m.refused=true;m.timeout=true;state.history.unshift(m);state.active=null;stopTimer();Audio2.alarm();saveState();updateStats();renderMissions();addNews("bad",m);if(state.wanted>=8)setTimeout(triggerCapture,800);}
function abortMission(){if(!state.active){log(t("no_active_mission"),"warn");return;}const m=state.active;m.done=true;m.refused=true;state.history.unshift(m);state.rep=Math.max(0,state.rep-2);state.streak=0;log(`${m.id} ${t("mission_cancelled")}`,"warn");state.active=null;stopTimer();Audio2.fail();saveState();updateStats();renderMissions();}
async function checkMissionProgress(input){if(!state.active)return;const m=state.active;const step=m.steps[state.activeStep];if(!step)return;const i=input.trim().toLowerCase();const w=step.cmd.toLowerCase();let matched=i===w||i.startsWith(w);if(!matched&&step._isDownload&&i.startsWith("download"))matched=true;if(matched){log("","");log({html:`<span class="ok">${t("step_done",{n:state.activeStep+1,tot:m.steps.length})}</span>`});state.activeStep++;updateStats();Audio2.step();if(state.activeStep>=m.steps.length)await completeMission(m);else{const nx=m.steps[state.activeStep];log({html:`<span class="hl">${t("next_step")}: <b>${escapeHtml(nx.cmd)}</b></span> <span class="sys">← ${escapeHtml(nx.d)}</span>`});}log("","");renderMissions();}}
async function completeMission(m){stopTimer();state.lastMissionTimeLeft=state.timerRemaining;const c=CONTACTS[m.client];const sc=Math.max(0.55,Math.min(0.98,0.92-m.risk*0.05+state.rep*0.003));const success=Math.random()<sc;log("","");if(success){state.money+=m.reward;state.rep+=m.rep;state.done+=1;state.streak+=1;if(m.client==="komiser_y")state.wanted=Math.max(0,state.wanted-1);else if(["chaos","hack"].includes(m.type)&&m.risk>=3)state.wanted=Math.min(10,state.wanted+1);log({html:`<span class="ok">${t("mission_complete")}</span>`});log(`  + ${money(m.reward)} · +${m.rep}`,"ok");log(`  ${c.emoji} ${clientName(m.client)}: "${rand(["Temiz iş.","Hızlı.","Saygı.","Sözünü tuttun."])}"`,"info");Audio2.coin();setTimeout(()=>Audio2.ok(),300);toast(t("toast_money",{amt:money(m.reward)}),"gold");addNews("good",m);}else{state.rep=Math.max(0,state.rep-Math.floor(m.rep/2));state.wanted=Math.min(10,state.wanted+1);state.streak=0;log({html:`<span class="err">${t("mission_failed")}</span>`});log(`  Aranma +1`,"err");Audio2.fail();addNews("bad",m);}m.done=true;state.history.unshift(m);state.active=null;state.activeStep=0;saveState();updateStats();renderMissions();checkAchievements();if(state.wanted>=8)setTimeout(triggerCapture,900);}
function hintMission(){if(!state.active){log(t("no_active_mission"),"warn");return;}const s=state.active.steps[state.activeStep];log("","");log({html:`<span class="hl">${t("next_hint")}: <b>${escapeHtml(s.cmd)}</b></span>`});log(`   ${escapeHtml(s.d)}`,"info");log("","");Audio2.notify();}
function refuseMission(id){const m=findMission(id);if(!m){log(`${id}: ${t("mission_not_found")}`,"err");return;}m.done=true;m.refused=true;state.history.unshift(m);const c=CONTACTS[m.client];log(`${m.id} ${t("mission_refused")}`,"warn");log(`  ${c.emoji} ${clientName(m.client)}: "${rand(["Anladım.","Yazık.","Sana yakışmadı.","Kendi bilirsin."])}"`,"sys");state.rep=Math.max(0,state.rep-1);state.streak=0;Audio2.fail();saveState();updateStats();renderMissions();}

function addNews(kind,mis){const tmpl={good:["news_good1","news_good2","news_good3"],bad:["news_bad1","news_bad2","news_bad3"],mission:["news_mis1","news_mis2"]};const text=t(rand(tmpl[kind]||tmpl.mission));const item={kind,title:text,desc:mis.title||mis.desc||"",time:Date.now(),source:["SiberHaber","DarkWatch","AnonFeed","TechPost","Gündem24"][randInt(0,4)]};state.news.unshift(item);if(state.news.length>30)state.news.pop();$("#tickerText").textContent=`${item.source}: ${item.title}`;if($("#panelNews").classList.contains("open"))renderNews();}
function renderNews(){const body=$("#newsBody");if(!state.news.length){body.innerHTML=`<div style="text-align:center;color:#6b8fad;padding:40px">${t("news_empty")}</div>`;return;}body.innerHTML=state.news.map(n=>{const cls=n.kind==="bad"?"bad":n.kind==="good"?"good":"";const ago=Math.floor((Date.now()-n.time)/1000);const agoStr=ago<60?`${ago}sn`:`${Math.floor(ago/60)}dk`;return`<div class="news-item ${cls}"><div class="cat">${n.source}</div><div class="headline">${escapeHtml(n.title)}</div>${n.desc?`<div class="body">${escapeHtml(n.desc)}</div>`:""}<div class="time">${agoStr}</div></div>`;}).join("");}

/* ============ PANELS ============ */
function openSide(id){try{Audio2.init();}catch(e){}document.getElementById(id).classList.add("open");hackInput.blur();}
function closeSide(id){document.getElementById(id).classList.remove("open");hackInput.focus();}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>{Audio2.panelClose();closeSide(b.dataset.close);}));
$("#btnMissions").addEventListener("click",()=>{Audio2.panel();renderMissions();openSide("panelMissions");});
$("#btnAch").addEventListener("click",()=>{Audio2.panel();renderAch();openSide("panelAch");});
$("#btnNews").addEventListener("click",()=>{Audio2.panel();renderNews();openSide("panelNews");});
$("#btnDict").addEventListener("click",()=>{Audio2.panel();renderDict();openSide("panelDict");});
$("#btnSound").addEventListener("click",()=>{Audio2.toggle();});
function renderMissions(){const body=$("#missionBody");const act=state.inbox.filter(m=>!m.done);if(!act.length){body.innerHTML=`<div style="text-align:center;color:#6b8fad;padding:60px 20px"><div style="font-size:44px;opacity:.6;margin-bottom:14px">📭</div>${t("missions_empty")}</div>`;return;}body.innerHTML=act.map(m=>{const c=CONTACTS[m.client];const isA=state.active&&state.active.id===m.id;const av=SVG.avatar[m.client]||SVG.avatar.anonim;let sh="";if(isA){sh=`<div class="mis-steps">${m.steps.map((s,i)=>{const cls=i<state.activeStep?"done":(i===state.activeStep?"now":"");const mk=i<state.activeStep?"✓":(i===state.activeStep?"▶":"·");return`<div class="sr ${cls}"><span class="sn">${mk}</span><span class="sc">${escapeHtml(s.cmd)}</span></div>`;}).join("")}</div>`;}return`<div class="mis-card ${isA?'active':''}"><div class="mis-top"><div class="mis-avatar">${av}<div class="type-dot" style="background:${c.color}">${(SVG.icon[m.type]||SVG.icon.hack).replace('<svg','<svg style="color:#000"')}</div></div><div class="mis-head-info"><div class="mis-cli" style="color:${c.color}">${c.emoji} ${escapeHtml(clientName(m.client))}</div><div class="mis-cli-type">${escapeHtml(clientType(m.client))} · ${t("city_"+c.city)}</div></div></div><div class="mis-title">${escapeHtml(m.title)}</div><div class="mis-desc">${escapeHtml(m.desc)}</div><div class="mis-meta"><span class="tag rew">${SVG.icon.coin} ${money(m.reward)}</span><span class="tag">📈 +${m.rep}</span>${m.risk?`<span class="tag risk">${SVG.icon.warn} ${"★".repeat(m.risk)}</span>`:""}<span class="tag">${SVG.icon.timer} ${m.time}s</span><span class="tag">${SVG.icon.check} ${m.steps.length}</span>${m.special?`<span class="tag special">🔥 ÖZEL</span>`:""}</div>${sh}<div class="mis-actions">${isA?`<button class="abt" data-act="abort" data-id="${m.id}">${SVG.icon.x} ${t("mission_cancelled").split(" ")[0].toUpperCase()}</button>`:`<button class="acc" data-act="accept" data-id="${m.id}">${SVG.icon.check} KABUL</button><button class="ref" data-act="refuse" data-id="${m.id}">${SVG.icon.x} REDDET</button>`}</div></div>`;}).join("");body.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{Audio2.clickDeep();const id=b.dataset.id;if(b.dataset.act==="accept")acceptMission(id,true);else if(b.dataset.act==="refuse")refuseMission(id);else if(b.dataset.act==="abort"){closeSide("panelMissions");abortMission();}}));}
function renderAch(){const body=$("#achBody");body.innerHTML=`<div class="sb-title">${t("ach_progress")}: ${state.unlockedAch.size} / ${ACHIEVEMENTS.length}</div><div class="ach-grid">${ACHIEVEMENTS.map(a=>{const u=state.unlockedAch.has(a.id);return`<div class="ach-card ${u?'unlocked':'locked'}"><div class="ach-icon">${SVG.ach[a.id]||SVG.ach.first_hack}</div><div class="ach-name">${escapeHtml(t("ach_"+a.id))}</div><div class="ach-desc">${escapeHtml(t("ach_"+a.id+"_d"))}</div></div>`;}).join("")}</div>`;}

function renderDict(f=""){const body=$("#dictBody");const fl=f.trim().toLowerCase();const byCat={};Object.entries(COMMAND_DOCS).forEach(([n,d])=>{if(fl&&!n.toLowerCase().includes(fl)&&!d.short.toLowerCase().includes(fl))return;if(!byCat[d.cat])byCat[d.cat]=[];byCat[d.cat].push([n,d]);});const tot=Object.values(byCat).reduce((a,x)=>a+x.length,0);if(!tot){body.innerHTML=`<div style="text-align:center;color:#6b8fad;padding:40px">Sonuç yok</div>`;return;}body.innerHTML=Object.entries(CAT_INFO).map(([k,info])=>{const it=byCat[k];if(!it||!it.length)return"";return`<div class="sb-title" style="margin-top:14px">${info.title}</div>${it.map(([n,d])=>`<div style="background:rgba(10,20,15,.5);border:1px solid rgba(51,255,102,.12);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-family:'JetBrains Mono',monospace"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:4px"><span style="color:#33ff66;font-weight:700;font-size:13px">${n}</span><span style="color:#6b8fad;font-size:11px">${d.short}</span></div><div style="color:#33ccff;font-size:11.5px;background:rgba(0,0,0,.3);padding:3px 7px;border-radius:5px;display:inline-block">${d.syntax}</div><div style="color:#9fc0a8;font-size:11.5px;margin-top:6px">${d.long}</div><div style="color:#ffff66;font-size:11.5px;margin-top:6px;padding-left:10px;border-left:2px solid rgba(255,255,102,.4)">› ${d.ex}</div></div>`).join("")}`;}).join("");}
$("#dictSearch").addEventListener("input",e=>renderDict(e.target.value));

/* ============ COMMANDS ============ */
const commands={
download:async(args)=>{if(!args[0])return"Kullanım: download <yol>";
const n=getNode(resolvePath(args[0]));if(!n)return`download: ${args[0]}: bulunamadı`;
if(n.type==="dir")return`download: klasör (downloadall kullan)`;
const name=basename(resolvePath(args[0]));const blob=new Blob([n.content||""],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);log(`✓ İndiriliyor: ${name}`,"ok");log(`  → İndirilenler klasörüne bak.`,"info");Audio2.coin();},
downloadall:async()=>{log("Sanal FS paketleniyor...","info");const files=[];const walk=(node,p)=>{for(const[k,c]of Object.entries(node.children||{})){const fp=p+"/"+k;if(c.type==="file")files.push({path:fp.slice(1),content:c.content||""});else walk(c,fp);}};walk(FS,"");log(`  ${files.length} dosya...`,"info");for(let i=0;i<files.length;i++){await sleep(180);const f=files[i];const blob=new Blob([f.content],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="golge-agi__"+f.path.replace(/\//g,"__");a.click();URL.revokeObjectURL(url);log(`  [${i+1}/${files.length}] ${f.path}`,"sys");}log(`✓ Tamamlandı.`,"ok");log(`  'mount' ile o klasörü bağla.`,"hl");},
mount:async()=>{await REALFS.mount();},
unmount:()=>REALFS.unmount(),
open:async()=>{if(window.showOpenFilePicker){try{const[h]=await window.showOpenFilePicker();const file=await h.getFile();const text=await file.text();log(`✓ ${file.name} (${file.size}b)`,"ok");log("  "+"-".repeat(30),"sys");text.split("\n").slice(0,100).forEach(l=>log("  "+l,"info"));}catch(e){if(e.name!=="AbortError")log("Hata: "+e.message,"err");}return;}const inp=document.createElement("input");inp.type="file";inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const tx=await f.text();log(`✓ ${f.name} (${f.size}b)`,"ok");tx.split("\n").slice(0,100).forEach(l=>log("  "+l,"info"));};inp.click();},
rls:async(a)=>{if(!REALFS.root)return"Önce 'mount'.";return await REALFS.ls(a.includes("-a"));},
rcd:async(a)=>{if(!REALFS.root)return"Önce 'mount'.";try{await REALFS.cd(a[0]);REALFS.updateStatus();}catch(e){return e.message;}},
rcat:async(a)=>{if(!a[0])return"Kullanım: rcat <dosya>";return await REALFS.cat(a[0]);},
rmkdir:async(a)=>{if(!a[0])return"Kullanım: rmkdir <i>";return await REALFS.mkdir(a[0]);},
rwrite:async(a)=>{if(a.length<2)return"Kullanım: rwrite <d> <i>";return await REALFS.write(a[0],a.slice(1).join(" "));},
rrm:async(a)=>{if(!a[0])return"Kullanım: rrm <i>";return await REALFS.rm(a[0]);},
rtree:async(a)=>{return await REALFS.tree(a[0]?parseInt(a[0]):3);},
rfind:async(a)=>{if(!a[0])return"Kullanım: rfind <d>";return await REALFS.find(a[0]);},
rpwd:()=>REALFS.pwd(),
help:(args)=>{const g={kabuk:["help","man","clear","history","echo"],dosya:["ls","cd","pwd","cat","grep","tree","find","download","downloadall","mount","unmount","open","rls","rcd","rcat","rmkdir","rwrite","rrm","rtree","rfind","rpwd"],görev:["missions","accept","refuse","hint","abort","status","contacts","history_mis","ach","news","spawn"],araç:["nmap","ssh","scan","exploit","backdoor","clean","whois","trace","submit","inject","overload","vanish","decrypt","crack"],sistem:["whoami","date","env","ping"],eğlence:["matrix","chaos","reset"]};if(args[0]&&g[args[0]]){log(`── ${args[0].toUpperCase()} ──`,"info");g[args[0]].forEach(c=>log("  "+c+"  —  "+(COMMAND_DOCS[c]?.short||"?")));return;}log("Kategoriler:","info");Object.keys(g).forEach(k=>log(`  help ${k}`,"hl"));},
man:(args)=>{if(!args[0])return"Kullanım: man <komut>";const d=COMMAND_DOCS[args[0]];if(!d)return`man: '${args[0]}' yok`;return[d.syntax,"",d.long,"","Örnek: "+d.ex];},
clear:()=>"__CLEAR__",
history:()=>history.length?history.map((h,i)=>`  ${String(i+1).padStart(3)}  ${h}`):"(boş)",
echo:(args)=>args.join(" "),
reset:()=>{log("Sıfırlamak için 'reset confirm' yaz.","warn");window._resetPending=true;window._resetTimer=setTimeout(()=>{window._resetPending=false;},5000);},
missions:()=>{const a=state.inbox.filter(m=>!m.done);if(!a.length)return[t("missions_empty")];const out=[`${a.length} aktif:`, ""];a.forEach(m=>{const c=CONTACTS[m.client];const isA=state.active&&state.active.id===m.id;out.push({html:`  ${isA?"▶":" "} <span class="hl">${m.id}</span> <span style="color:${c.color};font-weight:700">${c.emoji} ${escapeHtml(clientName(m.client))}</span> — ${escapeHtml(m.title)}`});});out.push("");out.push("accept <id> · refuse <id> · hint · abort");return out;},
accept:(args)=>{if(!args[0])return"Kullanım: accept <id>";acceptMission(args[0],false);},
refuse:(args)=>{if(!args[0])return"Kullanım: refuse <id>";refuseMission(args[0]);},
hint:()=>hintMission(),
abort:()=>abortMission(),
spawn:(args)=>{const m=makeMission(args[0]||null);if(!m)return"Görev üretilemedi";state.inbox.unshift(m);notifyMission(m);renderMissions();updateStats();return`✅ ${m.id} üretildi`;},
status:()=>{const out=["═══════════════════════════",`  ${t("stat_rep")}: ${state.rep}`,`  $: ${money(state.money)}`,`  ${t("stat_wanted")}: ${state.wanted}★`,`  ${t("stat_done")}: ${state.done}`,`  Streak: ${state.streak}`,`  Badge: ${state.unlockedAch.size}/${ACHIEVEMENTS.length}`,`  Contacts: ${state.contacts.size}`];if(state.active){out.push("───────────────────────────");out.push(`  AKTIF: ${state.active.id}`);out.push(`  PROGRESS: ${state.activeStep}/${state.active.steps.length}`);out.push(`  NEXT: ${state.active.steps[state.activeStep]?.cmd||"—"}`);out.push(`  LEFT: ${state.timerRemaining}s`);}out.push("═══════════════════════════");return out;},
contacts:()=>{const list=[...state.contacts];const out=[`${list.length} kişi:`,""];list.forEach(k=>{const c=CONTACTS[k];out.push({html:`  <span style="color:${c.color};font-weight:700">${c.emoji} ${escapeHtml(clientName(k))}</span> <span class="sys">(${escapeHtml(clientType(k))} · ${t("city_"+c.city)})</span>`});});return out;},
history_mis:()=>{if(!state.history.length)return"Henüz görev yok.";return state.history.slice(0,15).map(m=>{const c=CONTACTS[m.client];const st=m.timeout?"SÜRE":(m.refused?"RED":"TAMAM");return`  ${m.id} ${c.emoji} ${clientName(m.client)} — ${m.title} [${st}]`;});},
ach:()=>{const out=[`${state.unlockedAch.size}/${ACHIEVEMENTS.length}:`, ""];ACHIEVEMENTS.forEach(a=>{const u=state.unlockedAch.has(a.id);out.push({html:`  ${u?"🏆":"🔒"} <b style="color:${u?"#c4b5fd":"#6b8fad"}">${escapeHtml(t("ach_"+a.id))}</b> — <span class="sys">${escapeHtml(t("ach_"+a.id+"_d"))}</span>`});});return out;},
news:()=>{if(!state.news.length)return t("news_empty");return state.news.slice(0,10).map(n=>`  [${n.source}] ${n.title}`);},
pwd:()=>cwd,
cd:(args)=>{const p=args[0]||"/root";const abs=resolvePath(p);const n=getNode(abs);if(!n)return`cd: ${p}: yok`;if(n.type!=="dir")return`cd: ${p}: dizin değil`;cwd=abs===""?"/":abs;updatePrompt();},
ls:(args)=>{const flags=args.filter(a=>a.startsWith("-")).join("");const p=args.find(a=>!a.startsWith("-"))||".";const n=getNode(resolvePath(p));if(!n)return`ls: ${p}: yok`;if(n.type==="file")return p;let e=Object.keys(n.children).sort();if(!flags.includes("a"))e=e.filter(x=>!x.startsWith("."));if(!e.length)return"";if(flags.includes("l"))return e.map(x=>{const c=n.children[x],d=c.type==="dir";return`${d?"drwxr-xr-x":"-rw-r--r--"} 1 root root ${String(d?4096:(c.content||"").length).padStart(6)} Şub 14 03:22 ${x}${d?"/":""}`;});return{html:e.map(x=>n.children[x].type==="dir"?`<span class="dir">${escapeHtml(x)}/</span>`:escapeHtml(x)).join("  ")};},
cat:(args)=>{if(!args[0])return"Kullanım: cat <f>";const n=getNode(resolvePath(args[0]));if(!n)return`cat: ${args[0]}: yok`;if(n.type==="dir")return`cat: ${args[0]}: dizin`;return(n.content||"").split("\n");},
grep:(args)=>{if(args.length<2)return"Kullanım: grep <d> <f>";const n=getNode(resolvePath(args[1]));if(!n||n.type!=="file")return`grep: yok`;const re=new RegExp(escapeHtml(args[0]),"i");const l=(n.content||"").split("\n").filter(x=>re.test(x));if(!l.length)return"";return l.map(x=>({html:escapeHtml(x).replace(new RegExp(escapeHtml(args[0]),"gi"),m=>`<span class="hl">${m}</span>`)}));},
tree:(args)=>{const r=getNode(resolvePath(args[0]||"."));if(!r)return"Yol yok";const out=[args[0]||"."];const walk=(n,p)=>{const k=Object.keys(n.children).sort();k.forEach((x,i)=>{const last=i===k.length-1;const c=n.children[x];out.push(p+(last?"└── ":"├── ")+x+(c.type==="dir"?"/":""));if(c.type==="dir")walk(c,p+(last?"    ":"│   "));});};walk(r,"");return out;},
find:(args)=>{const q=args[0]||"";if(!q)return"Kullanım: find <d>";const out=[];const walk=(n,p)=>{for(const x of Object.keys(n.children)){const c=n.children[x];const full=p+"/"+x;if(x.includes(q))out.push(full);if(c.type==="dir")walk(c,full);}};walk(FS,"");return out.length?out:"(yok)";},
nmap:async(args)=>{const tar=args[0]||"127.0.0.1";log("Starting Nmap 7.94","info");await sleep(400);log(`Nmap report for ${tar}`);await sleep(300);log(`Host is up.`);log("");log("PORT STATE SERVICE");const ports=[22,80,443,3306,8080,4444].sort((a,b)=>a-b);for(const p of ports.filter(()=>Math.random()>0.4)){await sleep(120);log(`${String(p).padEnd(8)} open   ${({22:"ssh",80:"http",443:"https",3306:"mysql",8080:"http-proxy",4444:"krb524"})[p]}`,"warn");}log("");log("Nmap done");},
ssh:async(args)=>{const h=args[0]||"localhost";log(`Connecting to ${h}...`,"sys");await sleep(600);log(`Warning: added '${h}' to known hosts.`,"warn");await sleep(400);log(`Welcome to Ubuntu 22.04 LTS`,"ok");},
scan:async()=>{log("Ağ taranıyor...","info");for(let i=0;i<8;i++){await sleep(140);const ip=`10.0.${randInt(0,3)}.${randInt(1,250)}`;const port=[22,80,443,3306,8080,4444][randInt(0,5)];const open=Math.random()>0.55;log(`  ${ip}:${port} ....... ${open?"AÇIK":"kapalı"}`,open?"warn":"sys");}log("");log("Tarama tamamlandı.","ok");},
exploit:async(args)=>{const tg=args[0]||"hedef";log(`Exploit hazırlanıyor: CVE-2024-XXXX`,"info");for(const s of["Payload hazırlanıyor...","Yük gönderiliyor...","Bağlantı kuruluyor..."]){log("  → "+s,"warn");await sleep(300);}log(`✓ Exploit başarılı: ${tg}`,"ok");},
backdoor:async()=>{log("Arka kapı kuruluyor...","warn");for(const s of["Port 4444 dinleniyor...","Servis kaydediliyor...","Kalıcılık sağlanıyor..."]){log("  ✓ "+s,"sys");await sleep(250);}log("✓ Arka kapı aktif.","ok");},
clean:async()=>{log("İzler siliniyor...","info");for(const s of["Bash history...","Auth loglar...","SSH kayıtları...","Proxy zinciri..."]){log("  ✓ "+s,"sys");await sleep(220);}log("✓ İzler silindi.","ok");},
whois:(args)=>{const tg=args[0]||"hedef";return[`Hedef: ${tg}`,"Kayıt: 2019-03-14","Sunucu: [GİZLİ]","Konum: Amsterdam, NL"];},
trace:async(args)=>{const tg=args[0]||"hedef";log(`İz sürülüyor: ${tg}`,"info");for(let i=1;i<=5;i++){await sleep(240);log(`  ${i} 10.0.0.${randInt(1,255)} ${randInt(5,50)}ms`,"sys");}log(`  hedef: 203.0.113.${randInt(1,255)}`,"ok");log("✓ Konum bulundu.","ok");},
submit:async()=>{log("Kanıt paketi hazırlanıyor...","info");await sleep(400);log("Şifreli kanaldan gönderiliyor...","sys");await sleep(400);log("✓ Polise teslim edildi.","ok");},
inject:async()=>{log("Veri enjeksiyonu...","warn");for(const s of["Bağlantı sağlandı...","Tablo kilitlendi...","Yeni kayıtlar...","Commit..."]){log("  → "+s,"sys");await sleep(250);}log("✓ Enjeksiyon tamam.","ok");},
overload:async(args)=>{const tg=args[0]||"hedef";log(`${tg} yükleniyor...`,"warn");for(let i=0;i<=100;i+=20){await sleep(180);log(`  [${"█".repeat(i/20)}${"░".repeat(5-i/20)}] ${i}%`,"info");}log("✓ Sistem yanıt vermiyor.","ok");},
vanish:async()=>{log("Kaybolma protokolü...","warn");for(const s of["Tor devreleri...","VPN zinciri...","MAC adresi...","Terminal..."]){log("  ✓ "+s,"sys");await sleep(250);}log("✓ Kayboldun.","ok");},
decrypt:async()=>{log("AES-256 çözülüyor...","info");const hex="0123456789abcdef";let s="";for(let i=0;i<60;i++){s+=hex[Math.random()*16|0];if(i%2)s+=" ";}const l=document.createElement("div");l.className="l info";hackLog.appendChild(l);for(let i=0;i<s.length;i++){l.textContent=s.slice(0,i);hackLog.scrollTop=hackLog.scrollHeight;await sleep(12);}await sleep(250);return"✓ Çözüldü: 'gl0b4l@ccess'";},
crack:async(args)=>{const h=args[0]||"hash";log(`Hash kırılıyor: ${h}`,"info");for(const w of["123456","password","admin","root","qwerty","letmein"]){await sleep(180);log(`  Deniyor: ${w}`,"sys");if(Math.random()<0.35){log(`✓ Şifre: ${w}`,"ok");return;}}log("✗ Bulunamadı.","err");},
whoami:()=>"root",
date:()=>new Date().toString(),
env:()=>["USER=root","HOME=/root","SHELL=/bin/bash","PROXY=socks5://127.0.0.1:9050","ANON=1"],
ping:async(args)=>{const h=args[0]||"localhost";const ip=`10.0.${randInt(0,255)}.${randInt(0,255)}`;log(`PING ${h} (${ip})`);for(let i=0;i<4;i++){await sleep(400);log(`64 bytes from ${ip}: icmp_seq=${i+1} time=${(10+Math.random()*40).toFixed(1)}ms`,"sys");}log("");log("4 packets, 0% loss");},
matrix:(args)=>{const s=args[0]||"";if(s==="off"){document.getElementById("matrix").style.display="none";return"Matrix kapalı.";}if(!s){const k=Object.keys(MATRIX_STYLES);matrixStyle=k[(k.indexOf(matrixStyle)+1)%k.length];document.getElementById("matrix").style.display="block";startMatrix();return`Matrix: ${matrixStyle}`;}if(!MATRIX_STYLES[s])return`Bilinmeyen. Seçenekler: ${Object.keys(MATRIX_STYLES).join(", ")}, off`;matrixStyle=s;document.getElementById("matrix").style.display="block";startMatrix();return`Matrix: ${s}`;},
chaos:async()=>{log("KAOS MODU AKTİF","err");const events=["Rastgele sunucu çöktü.","Anonim mesaj: 'Seni izliyoruz.'","Gazete: 'Veri sızıntısı!'","Banka sistemi yavaşladı.","Sosyal medya hacklendi.","Şirket hisseleri %3 düştü.","Polis harekete geçti."];for(let i=0;i<6;i++){await sleep(400);log("  ⚡ "+rand(events),Math.random()>0.5?"warn":"info");}state.wanted=Math.min(10,state.wanted+1);saveState();updateStats();log("");log("Kaos bitti. Aranma +1","err");addNews("bad",{title:t("news_chaos"),desc:t("news_chaos_d")});if(state.wanted>=8)setTimeout(triggerCapture,800);}};

/* ============ EXECUTOR ============ */
async function runCommand(input){const parts=input.match(/(?:[^\s"]+|"[^"]*")+/g)||[];const cn=parts[0];const args=parts.slice(1).map(a=>a.replace(/^"|"$/g,""));log({html:`<span class="prompt">root@mainframe:${cwd==="/root"?"~":cwd}$</span> ${escapeHtml(input)}`},"sys");if(window._resetPending&&input.trim()==="reset confirm"){state.rep=0;state.money=0;state.done=0;state.wanted=0;state.streak=0;state.inbox=[];state.history=[];state.unlockedAch=new Set();state.contacts=new Set(["anonim","serseri_7"]);state.active=null;stopTimer();saveState();updateStats();clearTimeout(window._resetTimer);window._resetPending=false;log(t("reset_done")||"Sıfırlandı.","ok");return;}const fn=commands[cn];if(!fn){log(`${cn}: command not found. 'help' yaz.`,"err");Audio2.fail();return;}try{const r=await fn(args);if(r==="__CLEAR__"){hackLog.innerHTML="";return;}if(r==null){}else if(typeof r==="string")log(r);else if(Array.isArray(r))r.forEach(l=>log(l));else if(typeof r==="object")log(r);}catch(e){log(`${cn}: ${e.message}`,"err");}await checkMissionProgress(input);}

/* ============ TOAST ============ */
function toast(text,kind=""){const el=document.createElement("div");el.className="toast-item "+kind;const ic=kind==="gold"?SVG.icon.star:kind==="danger"?SVG.icon.warn:SVG.icon.check;el.innerHTML=`${ic}<span>${escapeHtml(text)}</span>`;$("#toast").appendChild(el);setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),400);},3000);}

/* ============ AUTOCOMPLETE ============ */
const acBox=$("#autocomplete");let acSel=0,acM=[];
function updateAC(){const v=hackInput.value;const w=v.split(/\s+/);if(w.length>1||!v){acBox.classList.remove("on");return;}acM=Object.keys(commands).filter(c=>c.startsWith(v)).slice(0,8);if(!acM.length||(acM.length===1&&acM[0]===v)){acBox.classList.remove("on");return;}acSel=0;acBox.innerHTML=acM.map((m,i)=>`<div class="item ${i===acSel?'sel':''}" data-cmd="${m}"><span class="nm">${m}</span><span class="ds">${COMMAND_DOCS[m]?.short||""}</span></div>`).join("");acBox.classList.add("on");acBox.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>{hackInput.value=el.dataset.cmd+" ";acBox.classList.remove("on");hackInput.focus();}));}

/* ============ INPUT ============ */
hackInput.addEventListener("input",updateAC);
hackInput.addEventListener("keydown",async(e)=>{
if(e.key==="Tab"&&acBox.classList.contains("on")){e.preventDefault();hackInput.value=acM[acSel]+" ";acBox.classList.remove("on");return;}
if(e.key==="ArrowDown"&&acBox.classList.contains("on")){e.preventDefault();acSel=Math.min(acM.length-1,acSel+1);acBox.querySelectorAll(".item").forEach((el,i)=>el.classList.toggle("sel",i===acSel));return;}
if(e.key==="ArrowUp"&&acBox.classList.contains("on")){e.preventDefault();acSel=Math.max(0,acSel-1);acBox.querySelectorAll(".item").forEach((el,i)=>el.classList.toggle("sel",i===acSel));return;}
if(e.key==="Enter"){acBox.classList.remove("on");const raw=hackInput.value.trim();hackInput.value="";if(!raw)return;history.push(raw);histIdx=history.length;Audio2.enter();await runCommand(raw);return;}
if(e.key==="ArrowUp"&&!acBox.classList.contains("on")){e.preventDefault();if(histIdx>0)histIdx--;hackInput.value=history[histIdx]||"";return;}
if(e.key==="ArrowDown"&&!acBox.classList.contains("on")){e.preventDefault();if(histIdx<history.length-1)histIdx++;else histIdx=history.length;hackInput.value=history[histIdx]||"";return;}});
hackInput.addEventListener("keypress",()=>Audio2.key());
document.addEventListener("click",()=>{if(!document.querySelector(".side.open"))hackInput.focus();});
document.addEventListener("keydown",(e)=>{
if(e.key==="Escape")document.querySelectorAll(".side.open").forEach(s=>s.classList.remove("open"));
if(e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
if(e.key==="K"||e.key==="k"){e.preventDefault();renderDict();openSide("panelDict");Audio2.panel();}
if(e.key==="J"||e.key==="j"){e.preventDefault();renderMissions();openSide("panelMissions");Audio2.panel();}
if(e.key==="N"||e.key==="n"){e.preventDefault();renderNews();openSide("panelNews");Audio2.panel();}
if(e.key==="A"||e.key==="a"){e.preventDefault();renderAch();openSide("panelAch");Audio2.panel();}
if(e.key==="S"||e.key==="s"){e.preventDefault();Audio2.toggle();}
if(e.key==="M"||e.key==="m"){e.preventDefault();try{Audio2.init();}catch(x){}Audio2.mission();}}});

/* ============ BOOT ============ */
async function bootSequence(isReset=false){if(state.booted&&!isReset)return;state.booted=true;const seq=[["[ SYS ] "+t("boot_1"),"sys",14],["[ OK ] "+t("boot_2"),"",8],["[ OK ] "+t("boot_3"),"",8],["[ OK ] "+t("boot_4"),"",8],["[ OK ] "+t("boot_5"),"",8],["[ OK ] "+t("boot_6"),"ok",8],["","",0],[t("boot_welcome"),"hl",12],[t("boot_line1"),"info",8],[t("boot_line2"),"info",8],["","",0],[t("boot_short_k"),"hl",8],[t("boot_short_j"),"hl",8],[t("boot_short_n"),"hl",8],[t("boot_short_a"),"hl",8],["","",0]];for(const[txt,c,sp]of seq){if(!txt){log("");continue;}await logTyped(txt,c,sp);}updateStats();await sleep(400);if(!state.inbox.filter(m=>!m.done).length){for(let i=0;i<3;i++){const m=makeMission();if(m){state.inbox.push(m);notifyMission(m);}await sleep(400);}}renderMissions();renderAch();if(!state.news.length){addNews("mission",{title:t("news_init1"),desc:t("news_init1_d")});addNews("mission",{title:t("news_init2"),desc:t("news_init2_d")});}scheduleSpawn(randInt(25000,35000));}

/* ============ INIT ============ */
setTimeout(()=>{document.querySelectorAll(".lang-btn").forEach(b=>b.addEventListener("click",()=>{setLang(b.dataset.lang);try{Audio2.panel();}catch(e){}}));setLang(LANG);},0);
setInterval(()=>{try{REALFS.updateStatus();}catch(e){}},1000);
renderDict();renderAch();updatePrompt();
const initAudioOnce=()=>{try{Audio2.init();Audio2.boot();}catch(e){}};
document.addEventListener("click",initAudioOnce,{once:true});
document.addEventListener("keydown",initAudioOnce,{once:true});
document.addEventListener("touchstart",initAudioOnce,{once:true});
setTimeout(()=>{try{bootSequence();}catch(e){}setTimeout(()=>{if(!state.inbox.filter(m=>!m.done).length){for(let i=0;i<3;i++){const m=makeMission();if(m){state.inbox.push(m);notifyMission(m);}}renderMissions();updateStats();}},3000);},200);
setTimeout(()=>hackInput.focus(),600);
</script>
