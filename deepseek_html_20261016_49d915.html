<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gölge Ağı v2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#000;color:#e6edf7;user-select:none}
  button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit}

  #matrix{position:absolute;inset:0;z-index:1;opacity:.7}
  .app{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    background:rgba(0,0,0,.55);overflow:hidden}
  .app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:100;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0px,rgba(0,0,0,.12) 1px,transparent 1px,transparent 3px)}

  .head{display:flex;justify-content:space-between;align-items:center;
    padding:10px 18px;border-bottom:1px solid rgba(51,255,102,.35);
    background:rgba(0,0,0,.4);flex-wrap:wrap;gap:10px;flex-shrink:0;z-index:10;position:relative}
  .head-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .head-tag{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:2px;color:#33ff66;font-weight:700}
  .head-tag svg{width:14px;height:14px;flex-shrink:0}
  .rec-dot{width:8px;height:8px;border-radius:50%;background:#ff3355;
    box-shadow:0 0 8px #ff3355;animation:recblink 1.2s infinite}
  @keyframes recblink{50%{opacity:.3}}

  .stat-group{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .stat{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px}
  .stat svg{width:14px;height:14px}
  .stat .lbl{color:#6b8fad;font-size:10px}
  .stat .val{color:#33ff66;font-weight:700}
  .stat.warn .val{color:#ffcc33}
  .stat.danger .val{color:#ff3355}

  .head-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .hbtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(51,255,102,.4);
    border-radius:6px;font-size:11px;letter-spacing:1.5px;color:#33ff66;font-weight:600;
    font-family:'JetBrains Mono',monospace;transition:.15s;position:relative}
  .hbtn svg{width:14px;height:14px;flex-shrink:0}
  .hbtn:hover{background:rgba(51,255,102,.12);border-color:#33ff66}
  .hbtn.alert{border-color:#ff3355;color:#ff3355;background:rgba(255,51,85,.08);
    animation:alertpulse 1.4s infinite}
  .hbtn.active{border-color:#ffff66;color:#ffff66;background:rgba(255,255,102,.1)}
  .hbtn .badge{position:absolute;top:-6px;right:-6px;background:#ff3355;color:#fff;
    font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 4px}
  @keyframes alertpulse{50%{background:rgba(255,51,85,.25)}}

  .timer-ring{display:none;align-items:center;gap:8px;padding:4px 10px;
    border:1px solid rgba(255,255,102,.4);border-radius:8px;background:rgba(255,255,102,.06)}
  .timer-ring.on{display:flex}
  .timer-ring svg{transform:rotate(-90deg)}
  .timer-ring .tval{font-family:'JetBrains Mono',monospace;font-size:13px;
    color:#ffff66;font-weight:700;min-width:42px}
  .timer-ring.warn{border-color:#ffcc33}
  .timer-ring.warn .tval{color:#ffcc33}
  .timer-ring.danger{border-color:#ff3355;animation:alertpulse 0.8s infinite}
  .timer-ring.danger .tval{color:#ff3355}
  .timer-ring .ring-bg{stroke:rgba(255,255,102,.15)}
  .timer-ring .ring-fg{stroke:#ffff66;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
  .timer-ring.warn .ring-fg{stroke:#ffcc33}
  .timer-ring.danger .ring-fg{stroke:#ff3355}

  .main{flex:1;display:flex;overflow:hidden;position:relative;z-index:5;min-height:0}
  .term{flex:1;display:flex;flex-direction:column;padding:14px 18px;min-width:0;
    font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;
    line-height:1.6;color:#33ff66;text-shadow:0 0 5px rgba(51,255,102,.35)}

  #hackLog{flex:1;overflow-y:auto;padding-right:8px;min-height:0}
  #hackLog::-webkit-scrollbar{width:6px}
  #hackLog::-webkit-scrollbar-thumb{background:rgba(51,255,102,.4);border-radius:3px}
  #hackLog .l{margin-bottom:1px;white-space:pre-wrap;word-break:break-word}
  .warn{color:#ffcc33}.err{color:#ff3355}.info{color:#33ccff}.sys{color:#888}
  .ok{color:#33ff66;font-weight:700}.hl{color:#ffff66;font-weight:700}
  .dir{color:#33aaff;font-weight:700}.prompt{color:#33ff66;font-weight:700}
  #hackLog .mission-box{border-left:3px solid #33ff66;padding:8px 12px;margin:10px 0;
    background:linear-gradient(90deg,rgba(51,255,102,.08),transparent);
    border-radius:0 8px 8px 0;display:block}
  #hackLog .mission-box .mh{color:#ffff66;font-weight:700;display:flex;align-items:center;gap:6px}
  #hackLog .mission-box .mr{color:#33ccff;font-size:12px;margin-top:2px}
  #hackLog .brief{border:1px solid rgba(255,204,51,.4);background:rgba(255,204,51,.05);
    padding:12px 16px;margin:12px 0;border-radius:8px;display:block;line-height:1.7}
  #hackLog .brief b{color:#ffff66}
  #hackLog .step-row{display:flex;gap:8px;padding:3px 0;align-items:baseline}
  #hackLog .step-row .n{color:#6b8fad;min-width:22px}
  #hackLog .step-row .c{color:#33ccff;font-weight:700}
  #hackLog .step-row .d{color:#8fa3c0;font-size:11.5px}
  #hackLog .step-row.done .c{color:#33ff66;text-decoration:line-through;opacity:.5}
  #hackLog .step-row.now .c{color:#ffff66;text-shadow:0 0 8px #ffff66}
  #hackLog .step-row.now .n{color:#ffff66}

  .input-row{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(51,255,102,.35);
    padding-top:10px;margin-top:8px;flex-shrink:0;position:relative}
  .input-row .pr{color:#33ff66;font-weight:700;white-space:nowrap}
  .input-row .mis-tag{color:#ffff66;font-size:10.5px;padding:3px 8px;
    border:1px solid rgba(255,255,102,.4);border-radius:5px;background:rgba(255,255,102,.08);
    white-space:nowrap;display:none;font-weight:700;letter-spacing:1px;
    display:none;align-items:center;gap:4px}
  .input-row .mis-tag.on{display:inline-flex}
  .input-row .mis-tag svg{width:12px;height:12px}
  #hackInput{flex:1;background:transparent;border:none;outline:none;color:#33ff66;
    font-family:inherit;font-size:13px;caret-color:#33ff66;min-width:0}

  .side{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:100%;z-index:30;
    background:rgba(3,8,6,.98);backdrop-filter:blur(16px);
    border-left:1.5px solid rgba(51,255,102,.35);transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .side.open{transform:translateX(0)}
  .side.mis{border-left-color:rgba(255,51,85,.5);background:rgba(10,3,6,.98)}
  .side.ach{border-left-color:rgba(167,139,250,.5);background:rgba(5,3,12,.98)}
  .side.news{border-left-color:rgba(34,211,238,.5);background:rgba(3,8,12,.98)}
  .side-head{padding:16px 22px;border-bottom:1px solid rgba(51,255,102,.25);
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-shrink:0}
  .side.mis .side-head{border-bottom-color:rgba(255,51,85,.3)}
  .side.ach .side-head{border-bottom-color:rgba(167,139,250,.3)}
  .side.news .side-head{border-bottom-color:rgba(34,211,238,.3)}
  .side-head h2{font-size:13px;letter-spacing:3px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  .side-head h2 svg{width:18px;height:18px}
  .side-head .ico-red{color:#ff3355}
  .side-head .ico-green{color:#33ff66}
  .side-head .ico-purple{color:#a78bfa}
  .side-head .ico-cyan{color:#22d3ee}
  .side-head button{padding:6px 12px;border:1px solid rgba(150,150,150,.4);
    border-radius:6px;font-size:11px;letter-spacing:1.5px;color:#c6d4e6;font-family:inherit}
  .side-head button:hover{background:rgba(255,255,255,.06)}
  .side-search{padding:10px 22px;border-bottom:1px solid rgba(150,150,150,.15)}
  .side-search input{width:100%;padding:9px 14px;background:rgba(10,20,15,.8);
    border:1.5px solid rgba(51,255,102,.3);border-radius:8px;color:#33ff66;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:none}
  .side-search input:focus{border-color:#33ff66}
  .side-body{flex:1;overflow-y:auto;padding:14px 20px 30px}
  .side-body::-webkit-scrollbar{width:8px}
  .side-body::-webkit-scrollbar-thumb{background:rgba(150,150,150,.3);border-radius:4px}

  .mis-card{background:linear-gradient(135deg,rgba(25,10,15,.9),rgba(15,5,8,.9));
    border:1px solid rgba(255,51,85,.25);border-radius:14px;padding:14px;
    margin-bottom:12px;transition:.2s;position:relative;overflow:hidden}
  .mis-card::before{content:"";position:absolute;top:0;right:0;width:120px;height:120px;
    background:radial-gradient(circle,rgba(255,51,85,.15),transparent 70%);
    pointer-events:none}
  .mis-card:hover{border-color:rgba(255,51,85,.6);transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(255,51,85,.15)}
  .mis-card.active{border-color:#ffff66;
    background:linear-gradient(135deg,rgba(35,30,5,.95),rgba(20,15,3,.95));
    box-shadow:0 0 0 1px rgba(255,255,102,.3),0 8px 24px rgba(255,255,102,.15)}
  .mis-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
  .mis-avatar{width:48px;height:48px;flex-shrink:0;
    background:rgba(0,0,0,.3);border-radius:12px;padding:4px;position:relative}
  .mis-avatar svg{width:100%;height:100%;display:block}
  .mis-avatar .type-dot{position:absolute;bottom:-2px;right:-2px;
    width:16px;height:16px;border-radius:50%;border:2px solid #000;
    display:flex;align-items:center;justify-content:center}
  .mis-avatar .type-dot svg{width:10px;height:10px}
  .mis-head-info{flex:1;min-width:0}
  .mis-cli{font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:2px;
    text-transform:uppercase}
  .mis-cli-type{color:#8fa3c0;font-size:10px;letter-spacing:1.5px}
  .mis-title{font-size:14.5px;font-weight:700;color:#ffff66;line-height:1.3;margin-bottom:8px}
  .mis-desc{font-size:12px;color:#c6d4e6;line-height:1.55;margin-bottom:10px}
  .mis-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .mis-meta .tag{padding:4px 8px;border-radius:6px;font-size:10px;letter-spacing:1px;
    font-weight:600;display:inline-flex;align-items:center;gap:4px;
    background:rgba(255,51,85,.12);border:1px solid rgba(255,51,85,.3);color:#ff8899}
  .mis-meta .tag svg{width:11px;height:11px}
  .mis-meta .tag.rew{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.3);color:#86efac}
  .mis-meta .tag.risk{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.3);color:#fde047}
  .mis-meta .tag.special{background:linear-gradient(90deg,rgba(255,51,85,.2),rgba(255,204,51,.2));
    border-color:#ffaa33;color:#ffcc88;animation:specialglow 1.6s infinite}
  @keyframes specialglow{50%{box-shadow:0 0 12px rgba(255,170,51,.5)}}
  .mis-steps{background:rgba(0,0,0,.35);border-radius:8px;padding:10px;margin-bottom:10px;
    font-family:'JetBrains Mono',monospace;font-size:11.5px}
  .mis-steps .sr{display:flex;gap:8px;align-items:baseline;padding:2px 0;color:#6b8fad}
  .mis-steps .sr .sn{width:18px;color:#6b8fad;flex-shrink:0}
  .mis-steps .sr .sc{color:#33ccff;font-weight:700}
  .mis-steps .sr.done .sc{color:#33ff66;text-decoration:line-through;opacity:.5}
  .mis-steps .sr.now .sc{color:#ffff66;text-shadow:0 0 6px #ffff66}
  .mis-steps .sr.now .sn{color:#ffff66;font-weight:700}
  .mis-actions{display:flex;gap:8px}
  .mis-actions button{flex:1;padding:9px 14px;border-radius:8px;font-size:11.5px;
    font-weight:700;letter-spacing:1.5px;transition:.15s;display:flex;
    align-items:center;justify-content:center;gap:6px;font-family:'JetBrains Mono',monospace}
  .mis-actions button svg{width:12px;height:12px}
  .mis-actions .acc{background:#33ff66;color:#06121c}
  .mis-actions .acc:hover{background:#66ff88}
  .mis-actions .ref{background:transparent;border:1px solid rgba(255,51,85,.4);color:#ff8899}
  .mis-actions .ref:hover{background:rgba(255,51,85,.15)}
  .mis-actions .abt{background:rgba(255,51,85,.15);color:#ff8899;border:1px solid rgba(255,51,85,.4)}

  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ach-card{background:linear-gradient(135deg,rgba(30,20,50,.6),rgba(15,10,30,.6));
    border:1px solid rgba(167,139,250,.2);border-radius:12px;padding:12px;
    text-align:center;transition:.2s;position:relative}
  .ach-card.locked{opacity:.35;filter:grayscale(1)}
  .ach-card:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.6)}
  .ach-card.unlocked{border-color:rgba(167,139,250,.5);
    background:linear-gradient(135deg,rgba(40,25,70,.8),rgba(20,10,40,.8))}
  .ach-icon{width:56px;height:56px;margin:0 auto 8px;position:relative;
    display:flex;align-items:center;justify-content:center}
  .ach-icon svg{width:100%;height:100%}
  .ach-name{font-size:11.5px;font-weight:700;color:#e6edf7;margin-bottom:3px;line-height:1.3}
  .ach-desc{font-size:10px;color:#8fa3c0;line-height:1.4}
  .ach-card.unlocked .ach-name{color:#c4b5fd}
  .ach-progress{font-size:9px;color:#6b8fad;margin-top:4px;letter-spacing:1px}

  .news-ticker{background:rgba(3,10,15,.85);border-top:1.5px solid rgba(34,211,238,.3);
    padding:8px 16px;display:flex;align-items:center;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:11px;flex-shrink:0;
    position:relative;z-index:8;overflow:hidden}
  .news-ticker svg.live{width:14px;height:14px;color:#22d3ee;flex-shrink:0;
    animation:newspulse 2s infinite}
  @keyframes newspulse{50%{opacity:.4}}
  .news-scroll{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:16px}
  .news-scroll .item{position:absolute;top:0;left:100%;display:inline-flex;gap:6px;
    align-items:center;animation:scrollnews 30s linear infinite}
  .news-scroll .item svg{width:11px;height:11px}
  @keyframes scrollnews{from{left:100%}to{left:-100%}}
  .news-lbl{color:#22d3ee;font-weight:700;letter-spacing:2px;font-size:10px}

  .news-item{background:rgba(10,20,30,.6);border-left:3px solid #22d3ee;
    border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px;
    transition:.15s;position:relative;overflow:hidden}
  .news-item:hover{background:rgba(15,30,45,.8)}
  .news-item.warn{border-color:#ffcc33}
  .news-item.bad{border-color:#ff3355}
  .news-item.good{border-color:#33ff66}
  .news-item .cat{font-size:9.5px;letter-spacing:2px;color:#22d3ee;
    font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .news-item .cat svg{width:11px;height:11px}
  .news-item .headline{font-size:13.5px;font-weight:700;color:#e6edf7;margin-bottom:6px;line-height:1.35}
  .news-item .body{font-size:11.5px;color:#8fa3c0;line-height:1.55}
  .news-item .time{font-size:10px;color:#6b8fad;margin-top:6px;font-family:monospace}

  #capture{position:fixed;inset:0;z-index:200;display:none;
    background:rgba(30,0,5,.97);backdrop-filter:blur(10px);
    align-items:center;justify-content:center;flex-direction:column;
    text-align:center;padding:30px}
  #capture.on{display:flex;animation:captureFade .5s}
  @keyframes captureFade{from{opacity:0}to{opacity:1}}
  #capture svg.big{width:min(280px,60vmin);height:min(280px,60vmin);
    filter:drop-shadow(0 0 40px #ff3355)}
  #capture h1{font-size:42px;font-weight:900;color:#ff3355;letter-spacing:6px;
    margin-top:20px;font-family:'JetBrains Mono',monospace;
    text-shadow:0 0 20px #ff3355;animation:captureBlink .8s infinite}
  @keyframes captureBlink{50%{opacity:.4}}
  #capture p{color:#ff8899;font-size:14px;margin-top:12px;max-width:500px;
    line-height:1.7;font-family:'JetBrains Mono',monospace}
  #capture .stats{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap;justify-content:center}
  #capture .st{background:rgba(0,0,0,.5);border:1px solid rgba(255,51,85,.4);
    padding:12px 20px;border-radius:10px;font-family:'JetBrains Mono',monospace}
  #capture .st .l{font-size:10px;letter-spacing:2px;color:#ff8899}
  #capture .st .v{font-size:22px;font-weight:800;color:#ff3355;margin-top:4px}
  #capture button{margin-top:26px;padding:14px 30px;border-radius:10px;
    background:#ff3355;color:#fff;font-weight:800;letter-spacing:3px;
    font-family:'JetBrains Mono',monospace;font-size:14px;
    transition:.15s;box-shadow:0 8px 30px rgba(255,51,85,.4)}
  #capture button:hover{background:#ff5577;transform:translateY(-2px)}

  .toast{position:fixed;bottom:60px;right:20px;z-index:150;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast-item{background:rgba(3,20,10,.95);border:1.5px solid #33ff66;border-radius:10px;
    padding:12px 18px;font-family:'JetBrains Mono',monospace;font-size:12px;
    color:#33ff66;box-shadow:0 8px 30px rgba(51,255,102,.3);
    display:flex;align-items:center;gap:10px;animation:toastIn .4s;min-width:220px}
  .toast-item svg{width:20px;height:20px;flex-shrink:0}
  .toast-item.gold{border-color:#ffcc33;color:#ffcc33;box-shadow:0 8px 30px rgba(255,204,51,.4)}
  .toast-item.danger{border-color:#ff3355;color:#ff8899;box-shadow:0 8px 30px rgba(255,51,85,.4)}
  @keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
  .toast-item.out{animation:toastOut .4s forwards}
  @keyframes toastOut{to{transform:translateX(100%);opacity:0}}

  #autocomplete{position:absolute;bottom:100%;left:0;right:0;background:rgba(2,10,5,.98);
    border:1px solid rgba(51,255,102,.4);border-radius:8px 8px 0 0;
    max-height:180px;overflow-y:auto;display:none;z-index:50;
    font-family:'JetBrains Mono',monospace;font-size:12px}
  #autocomplete.on{display:block}
  #autocomplete .item{padding:7px 14px;cursor:pointer;color:#8fa3c0;
    display:flex;justify-content:space-between;gap:12px;transition:.1s}
  #autocomplete .item:hover,#autocomplete .item.sel{background:rgba(51,255,102,.12);color:#33ff66}
  #autocomplete .item .nm{font-weight:700}
  #autocomplete .item .ds{font-size:10.5px;color:#6b8fad}

  .sb-title{font-size:10px;letter-spacing:3px;color:#6b8fad;font-weight:700;
    margin-bottom:8px;text-transform:uppercase}

  @media(max-width:800px){
    .side{width:100%}
    .term{padding:10px 12px;font-size:12px}
    .head{padding:8px 12px;font-size:10px}
    .head-tag{font-size:10px;letter-spacing:1px}
    .stat{font-size:10px}
    .hbtn{padding:5px 9px;font-size:10px;letter-spacing:1px}
    .head-tag svg{width:12px;height:12px}
    #capture h1{font-size:26px;letter-spacing:3px}
    .ach-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="app">
  <div class="head">
    <div class="head-left">
      <div class="head-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h6M8 17h4"/></svg>
        ROOT@MAINFRAME
      </div>
      <div class="rec-dot"></div>
      <div class="stat-group">

const Audio2 = {
  ctx: null, enabled: true, master: null, ambient: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 1.0;
      this.master.connect(this.ctx.destination);
      this.startAmbient();
    } catch (e) { console.warn("audio:", e); this.enabled = false; }
  },
  startAmbient() {
    try {
      const o1 = this.ctx.createOscillator();
      const o2 = this.ctx.createOscillator();
      const o3 = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      const lp = this.ctx.createBiquadFilter();
      o1.frequency.value = 55; o2.frequency.value = 82.5; o3.frequency.value = 110;
      o1.type = "sine"; o2.type = "triangle"; o3.type = "sine";
      lp.type = "lowpass"; lp.frequency.value = 450;
      g.gain.value = 0.12;
      o1.connect(lp); o2.connect(lp); o3.connect(lp);
      lp.connect(g).connect(this.master);
      o1.start(); o2.start(); o3.start();
      this.ambient = { o1, o2, o3, g };
    } catch(e) { console.warn(e); }
  },
  beep(freq, dur, type = "square", vol = 0.15) {
    if (!this.ctx || !this.enabled) return;
    try {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.frequency.value = freq; o.type = type;
      const t = this.ctx.currentTime;

};
let matrixStyle = "classic", matrixAnim = null, matrixDrops = [];
function startMatrix() {
  const cvs = document.getElementById("matrix");
  cvs.width = innerWidth; cvs.height = innerHeight;
  const ctx = cvs.getContext("2d");
  const fs = 16, cols = Math.floor(cvs.width / fs);
  matrixDrops = new Array(cols).fill(0).map(() => Math.random() * cvs.height / fs);
  const style = MATRIX_STYLES[matrixStyle];
  const chars = style.chars;
  let hue = 0;
  function frame() {
    ctx.fillStyle = style.fade;
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.font = fs + "px monospace";
    if (style.rainbow) hue = (hue + 0.6) % 360;
    for (let i = 0; i < matrixDrops.length; i++) {
      const ch = chars[Math.random() * chars.length | 0];
      const y = matrixDrops[i] * fs;
      if (style.rainbow) {
        ctx.fillStyle = Math.random() < 0.02
          ? `hsl(${(hue + i * 3) % 360}, 100%, 90%)`
          : `hsl(${(hue + i * 3) % 360}, 100%, 60%)`;
      } else {
        ctx.fillStyle = Math.random() < 0.02 ? style.head : style.normal;
      }
      ctx.globalAlpha = 0.5 + Math.random() * 0.4;
      ctx.fillText(ch, i * fs, y);
      ctx.globalAlpha = 1;
      if (y > cvs.height && Math.random() > 0.975) matrixDrops[i] = 0;
      matrixDrops[i]++;
    }
    matrixAnim = requestAnimationFrame(frame);
  }
  cancelAnimationFrame(matrixAnim); frame();
}
startMatrix();
addEventListener("resize", startMatrix);

function getNode(abs) {
  if (abs === "/" || abs === "") return FS;
  const parts = abs.split("/").filter(Boolean);
  let n = FS;
  for (const p of parts) { if (!n.children || !n.children[p]) return null; n = n.children[p]; }
  return n;
}
function resolvePath(p) {
  if (!p) return cwd;
  let base;
  if (p.startsWith("/")) base = p;
  else if (p.startsWith("~")) base = "/root" + p.slice(1);
  else base = (cwd === "/" ? "" : cwd) + "/" + p;
  const parts = [];
  for (const seg of base.split("/")) {
    if (!seg || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return "/" + parts.join("/");
}
function parentPath(p) { return p.split("/").slice(0, -1).join("/") || "/"; }
function basename(p) { return p.split("/").pop(); }

  if (state.rep >= 30) state.contacts.add("patron_v");
  if (state.rep >= 40) state.contacts.add("avukat");
  if (state.rep >= 60) state.contacts.add("doktor_k");
  let available = MISSION_TEMPLATES.filter(t => state.contacts.has(t.client));
  if (forceClient) available = available.filter(t => t.client === forceClient);
  if (!available.length) available = MISSION_TEMPLATES.filter(t => state.contacts.has(t.client));
  if (!available.length) return null;
  const t = rand(available);
  misCounter++;
  const target = `10.0.${randInt(0,5)}.${randInt(2,250)}`;
  const diffMult = 1 + Math.floor(state.rep / 25) * 0.15;
  const reward = Math.round((t.reward + randInt(-200, 400)) * diffMult);
  let steps = t.steps.map(s => ({ cmd: s.cmd.replace(/{t}/g, target), d: s.d }));
  const extraSteps = Math.floor(state.rep / 40);
  if (extraSteps > 0) {
    const extras = [
      { cmd:`scan`, d:"Son kontrol" },
      { cmd:`whois ${target}`, d:"Hedefi doğrula" },
      { cmd:`cat /etc/hosts`, d:"Yapılandırmayı oku" },
    ];
    for (let i = 0; i < Math.min(extraSteps, 3); i++) steps.splice(steps.length - 1, 0, extras[i % extras.length]);
  }
  const baseTime = 30 + steps.length * 8;
  const time = Math.round(baseTime / diffMult);
  const special = Math.random() < 0.08;
  return {
    id:"M" + String(misCounter).padStart(3, "0"),
    client: t.client, type: t.type,
    title: special ? "⚡ " + t.title : t.title,
    desc: t.desc, reward: special ? reward * 3 : reward,
    rep: t.rep, risk: t.risk, time, special, target, steps,
    done: false, arrived: Date.now(),
  };
}
function notifyMission(mis) {
  const c = CONTACTS[mis.client];
  log("", "");

    <span class="mh">${mis.special ? "🔥" : "📨"} YENİ GÖREV — ${mis.id}</span>
    <div class="mr"><b>Gönderen:</b> <span style="color:${c.color};font-weight:700">${c.emoji} ${c.name}</span> · ${c.type}</div>

let spawnTimer = null;
function scheduleSpawn(delay) {
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(() => {
    if (state.inbox.filter(m => !m.done).length < 6) {
      const m = makeMission();
      if (m) { state.inbox.unshift(m); notifyMission(m); renderMissions(); }
    }
    scheduleSpawn(randInt(25000, 45000));
  }, delay);
}

function findMission(id) { return state.inbox.find(m => m.id.toLowerCase() === id.toLowerCase() && !m.done); }
function acceptMission(id, fromPanel) {
  const m = findMission(id);
  if (!m) { log(`${id}: görev bulunamadı.`, "err"); Audio2.fail(); return; }
  if (state.active) { log(`Aktif görev var: ${state.active.id}. 'abort' ile iptal et.`, "warn"); return; }
  state.active = m;
  state.activeStep = 0;
  state.timerRemaining = m.time;
  startTimer();
  if (fromPanel) closeSide("panelMissions");
  updateStats();
  renderMissions();
  showBriefing(m);
  Audio2.enter();
}
function showBriefing(m) {
  const c = CONTACTS[m.client];
  log("", "");
  const stepsHtml = m.steps.map((s, i) =>
    `<div class="step-row ${i === 0 ? 'now' : ''}">
      <span class="n">${i+1}.</span><span class="c">${escapeHtml(s.cmd)}</span>
      <span class="d">← ${escapeHtml(s.d)}</span>
    </div>`).join("");
  log({ html: `<span class="brief">
    <b>📋 GÖREV BRİFİNGİ — ${m.id} ${m.special ? "🔥 ÖZEL" : ""}</b><br>
    <b>Müşteri:</b> <span style="color:${c.color}">${c.emoji} ${c.name}</span> · ${c.type}<br>
    <b>Hedef:</b> ${m.target} · <b>Şehir:</b> ${c.city}<br>
    <b>Ödeme:</b> ${money(m.reward)} · <b>İtibar:</b> +${m.rep} · <b>Süre:</b> ${m.time}s<br><br>
    <b>AÇIKLAMA:</b><br>${escapeHtml(m.desc)}<br><br>
    <b>ADIMLAR (sırayla yaz):</b>
    ${stepsHtml}
    <br><span style="color:#ffff66">'hint' ipucu, 'abort' iptal.</span>
  </span>` });
  log("", "");
  log({ html: `<span class="ok">▶ İlk komut: <b>${escapeHtml(m.steps[0].cmd)}</b></span>` });
  log("", "");
}
function startTimer() {
  clearInterval(state.timerInterval);
  const ring = document.getElementById("timerRing");
  ring.classList.add("on");
  const updateRing = () => {
    const pct = state.timerRemaining / state.active.time;
    const circ = 2 * Math.PI * 11;
    document.getElementById("ringFg").setAttribute("stroke-dashoffset", circ * (1 - pct));
    const mm = Math.floor(state.timerRemaining / 60), ss = state.timerRemaining % 60;
    document.getElementById("timerVal").textContent = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    ring.classList.toggle("warn", pct <= 0.5 && pct > 0.25);
    ring.classList.toggle("danger", pct <= 0.25);
  };
  updateRing();
  state.timerInterval = setInterval(() => {
    state.timerRemaining--;
    if (state.timerRemaining <= 5 && state.timerRemaining > 0) Audio2.tick();
    if (state.timerRemaining <= 0) { clearInterval(state.timerInterval); timeUp(); return; }
    updateRing();
  }, 1000);
}
function stopTimer() {
  clearInterval(state.timerInterval);
  document.getElementById("timerRing").classList.remove("on", "warn", "danger");
}
async function timeUp() {
  const m = state.active;
  if (!m) return;
  log("", ""); log("⏰ SÜRE DOLDU!", "err");
  log(`  Polis sinyali aldı.`, "err");
  state.wanted = Math.min(10, state.wanted + 2);
  state.rep = Math.max(0, state.rep - Math.floor(m.rep / 2));
  state.streak = 0;
  m.done = true; m.refused = true; m.timeout = true;
  state.history.unshift(m);
  state.active = null;
  stopTimer();
  Audio2.alarm();
  saveState(); updateStats(); renderMissions();
  addNews("bad", m);
  if (state.wanted >= 8) setTimeout(triggerCapture, 800);
}
function abortMission() {
  if (!state.active) { log("Aktif görev yok.", "warn"); return; }
  const m = state.active;
  m.done = true; m.refused = true;
  state.history.unshift(m);
  state.rep = Math.max(0, state.rep - 2);
  state.streak = 0;
  log(`${m.id} iptal. İtibar -2`, "warn");
  state.active = null;
  stopTimer();
  Audio2.fail();
  saveState(); updateStats(); renderMissions();
}
async function checkMissionProgress(rawInput) {
  if (!state.active) return;
  const m = state.active;
  const step = m.steps[state.activeStep];
  if (!step) return;
  const input = rawInput.trim().toLowerCase();
  const want = step.cmd.toLowerCase();
  const matched = input === want || input.startsWith(want);
  if (matched) {
    log("", "");
    log({ html: `<span class="ok">✓ ADIM ${state.activeStep+1}/${m.steps.length} TAMAM</span>` });
    state.activeStep++;
    updateStats();
    Audio2.step();
    if (state.activeStep >= m.steps.length) await completeMission(m);
    else {
      const nx = m.steps[state.activeStep];
      log({ html: `<span class="hl">▶ Sonraki: <b>${escapeHtml(nx.cmd)}</b></span> <span class="sys">← ${escapeHtml(nx.d)}</span>` });
    }
    log("", "");
    renderMissions();
  }
}
async function completeMission(m) {
  stopTimer();
  state.lastMissionTimeLeft = state.timerRemaining;
  const c = CONTACTS[m.client];
  const successChance = Math.max(0.55, Math.min(0.98, 0.92 - m.risk * 0.05 + state.rep * 0.003));
  const success = Math.random() < successChance;
  log("", "");
  if (success) {
    state.money += m.reward;
    state.rep += m.rep;
    state.done += 1;
    state.streak += 1;
    if (m.client === "komiser_y") state.wanted = Math.max(0, state.wanted - 1);
    else if (["chaos","hack"].includes(m.type) && m.risk >= 3) state.wanted = Math.min(10, state.wanted + 1);
    log({ html: `<span class="ok">════ ✓✓✓ GÖREV TAMAMLANDI ✓✓✓ ════</span>` });
    log(`  + ${money(m.reward)}  ·  +${m.rep} itibar`, "ok");
    log(`  ${c.emoji} ${c.name}: "${rand(["Temiz iş.","Beklediğimden hızlı.","Ağ seni hatırlayacak.","Sözünü tuttun."])}"`, "info");
    Audio2.coin();
    setTimeout(() => Audio2.ok(), 300);
    toast(`+${money(m.reward)} kazandın!`, "gold");
    addNews("good", m);
  } else {
    state.rep = Math.max(0, state.rep - Math.floor(m.rep / 2));
    state.wanted = Math.min(10, state.wanted + 1);
    state.streak = 0;
    log({ html: `<span class="err">✗ SON ADIMDA YAKALANDIN</span>` });
    log(`  Aranma +1`, "err");
    Audio2.fail();
    addNews("bad", m);
  }
  m.done = true;
  state.history.unshift(m);
  state.active = null;
  state.activeStep = 0;
  saveState(); updateStats(); renderMissions();
  checkAchievements();
  if (state.wanted >= 8) setTimeout(triggerCapture, 900);
}
function hintMission() {
  if (!state.active) { log("Aktif görev yok.", "warn"); return; }
  const step = state.active.steps[state.activeStep];
  log("", "");
  log({ html: `<span class="hl">📌 Sıradaki: <b>${escapeHtml(step.cmd)}</b></span>` });
  log(`   ${escapeHtml(step.d)}`, "info");
  log("", "");
  Audio2.beep(1200, 0.08, "sine", 0.15);
}
function refuseMission(id) {
  const m = findMission(id);
  if (!m) { log(`${id}: görev yok.`, "err"); return; }
  m.done = true; m.refused = true;
  state.history.unshift(m);
  const c = CONTACTS[m.client];
  log(`${m.id} reddedildi.`, "warn");
  log(`  ${c.emoji} ${c.name}: "${rand(["Anladım.","Yazık.","Sana yakışmadı.","Kendi bilirsin."])}"`, "sys");
  state.rep = Math.max(0, state.rep - 1);
  state.streak = 0;
  Audio2.fail();
  saveState(); updateStats(); renderMissions();
}

function addNews(kind, mis) {
  const templates = {
    good:[ "Gizemli bir hacker şirket sistemlerinden veri sızdırdı", "Siber saldırı sonrası bir şirket kayıtlarını kaybetti", "Karanlık ağda yeni bir isim konuşuluyor" ],
    bad:[ "Polis siber suçlar birimi harekete geçti", "Bir şirket veri sızıntısı sonrası dava açtı", "Anonim bir hesap ifşa edildi" ],
    mission:[ "Yeni bir siber olay rapor edildi", "Karanlık ağda hareketlilik var" ],
  };
  const text = rand(templates[kind] || templates.mission);
  const item = { kind, title: text, desc: mis.title || mis.desc || "", time: Date.now(),
    source:["SiberHaber","DarkWatch","AnonFeed","TechPost","Gündem24"][randInt(0,4)] };
  state.news.unshift(item);
  if (state.news.length > 30) state.news.pop();

}
function updateTicker() {
  const latest = state.news[0];
  if (!latest) return;
  document.getElementById("tickerText").textContent = `${latest.source}: ${latest.title}`;
}
function renderNews() {
  const body = document.getElementById("newsBody");
  if (!state.news.length) { body.innerHTML = `<div style="text-align:center;color:#6b8fad;padding:40px">Henüz haber yok.</div>`; return; }
  body.innerHTML = state.news.map(n => {
    const cls = n.kind === "bad" ? "bad" : n.kind === "good" ? "good" : "";
    const ago = Math.floor((Date.now() - n.time) / 1000);
    const agoStr = ago < 60 ? `${ago} sn önce` : `${Math.floor(ago/60)} dk önce`;
    return `<div class="news-item ${cls}">
      <div class="cat">${SVG.icon.warn.replace('<svg','<svg style="color:#22d3ee"')} ${n.source}</div>
      <div class="headline">${escapeHtml(n.title)}</div>
      ${n.desc ? `<div class="body">${escapeHtml(n.desc)}</div>` : ""}
      <div class="time">${agoStr}</div>
    </div>`;
  }).join("");
}

  const f = filter.trim().toLowerCase();

  Object.entries(COMMAND_DOCS).forEach(([name, doc]) => {

    byCat[doc.cat].push([name, doc]);

    let e = Object.keys(n.children).sort();
    if (!flags.includes("a")) e = e.filter(x => !x.startsWith("."));

    if (args.length < 2) return "Kullanım: grep <desen> <dosya>";
    const n = getNode(resolvePath(args[1]));
    if (!n || n.type !== "file") return `grep: ${args[1]}: No such file`;
    const re = new RegExp(escapeHtml(args[0]), "i");

    const root = getNode(resolvePath(args[0] || "."));
    if (!root) return "Yol bulunamadı";
    const out = [args[0] || "."];
    function walk(n, p) {
      const k = Object.keys(n.children).sort();
      k.forEach((x, i) => {
        const last = i === k.length - 1;
        const c = n.children[x];
        out.push(p + (last ? "└── " : "├── ") + x + (c.type === "dir" ? "/" : ""));
        if (c.type === "dir") walk(c, p + (last ? "    " : "│   "));
      });
    }
    walk(root, "");
    return out;

   EXECUTOR
   ============================================================ */
async function runCommand(input) {
  const parts = input.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
  const cmdName = parts[0];
  const args = parts.slice(1).map(a => a.replace(/^"|"$/g, ""));
  log({ html: `<span class="prompt">root@mainframe:${cwd === "/root" ? "~" : cwd}$</span> ${escapeHtml(input)}` }, "sys");
  if (window._resetPending && input.trim() === "reset confirm") {
    state.rep=0; state.money=0; state.done=0; state.wanted=0; state.streak=0;
    state.inbox=[]; state.history=[]; state.unlockedAch=new Set();
    state.contacts=new Set(["anonim", "serseri_7"]);
    state.active=null; state.activeStep=0;
    stopTimer();
    saveState(); updateStats();
    clearTimeout(window._resetTimer); window._resetPending=false;
    log("Sıfırlandı.", "ok");
    return;
  }
  const fn = commands[cmdName];
  if (!fn) { log(`${cmdName}: command not found. 'help' yaz.`, "err"); Audio2.fail(); return; }
  try {
    const result = await fn(args);
    if (result === "__CLEAR__") { hackLog.innerHTML = ""; return; }
    if (result == null) {}
    else if (typeof result === "string") log(result);
    else if (Array.isArray(result)) result.forEach(l => log(l));
    else if (typeof result === "object") log(result);
  } catch (e) { log(`${cmdName}: ${e.message}`, "err"); }
  await checkMissionProgress(input);
}

function toast(text, kind = "") {
  const el = document.createElement("div");
  el.className = "toast-item " + kind;
  const iconSvg = kind === "gold" ? SVG.icon.star : kind === "danger" ? SVG.icon.warn : SVG.icon.check;
  el.innerHTML = `${iconSvg}<span>${escapeHtml(text)}</span>`;
  document.getElementById("toast").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 400); }, 3000);
}

      <span class="ds">${COMMAND_DOCS[m]?.short || ""}</span>
    </div>`).join("");
  acBox.classList.add("on");
  acBox.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", () => { hackInput.value = el.dataset.cmd + " "; acBox.classList.remove("on"); hackInput.focus(); });
  });
}

/* ============================================================
   INPUT
   ============================================================ */
hackInput.addEventListener("input", updateAutocomplete);
hackInput.addEventListener("keydown", async (e) => {
  if (e.key === "Tab" && acBox.classList.contains("on")) {
    e.preventDefault();
    hackInput.value = acMatches[acSelected] + " ";
    acBox.classList.remove("on"); return;
  }
  if (e.key === "ArrowDown" && acBox.classList.contains("on")) {
    e.preventDefault();
    acSelected = Math.min(acMatches.length - 1, acSelected + 1);
    acBox.querySelectorAll(".item").forEach((el, i) => el.classList.toggle("sel", i === acSelected));
    return;
  }
  if (e.key === "ArrowUp" && acBox.classList.contains("on")) {
    e.preventDefault();
    acSelected = Math.max(0, acSelected - 1);
    acBox.querySelectorAll(".item").forEach((el, i) => el.classList.toggle("sel", i === acSelected));
    return;
  }
  if (e.key === "Enter") {
    acBox.classList.remove("on");
    const raw = hackInput.value.trim();
    hackInput.value = "";
    if (!raw) return;
    history.push(raw);
    histIdx = history.length;
    Audio2.enter();
    await runCommand(raw);
    return;
  }
  if (e.key === "ArrowUp" && !acBox.classList.contains("on")) { e.preventDefault(); if (histIdx > 0) histIdx--; hackInput.value = history[histIdx] || ""; return; }
  if (e.key === "ArrowDown" && !acBox.classList.contains("on")) { e.preventDefault(); if (histIdx < history.length - 1) histIdx++; else histIdx = history.length; hackInput.value = history[histIdx] || ""; return; }
});
hackInput.addEventListener("keypress", () => Audio2.key());
document.addEventListener("click", (e) => {
  if (!document.querySelector(".side.open")) hackInput.focus();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.querySelectorAll(".side.open").forEach(s => s.classList.remove("open"));
  if (e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === "K" || e.key === "k") { e.preventDefault(); renderDict(); openSide("panelDict"); Audio2.panel(); }
    if (e.key === "J" || e.key === "j") { e.preventDefault(); renderMissions(); openSide("panelMissions"); Audio2.panel(); }
    if (e.key === "N" || e.key === "n") { e.preventDefault(); renderNews(); openSide("panelNews"); Audio2.panel(); }
    if (e.key === "A" || e.key === "a") { e.preventDefault(); renderAch(); openSide("panelAch"); Audio2.panel(); }
    if (e.key === "S" || e.key === "s") { e.preventDefault(); Audio2.toggle(); }
    if (e.key === "M" || e.key === "m") { e.preventDefault(); try { Audio2.init(); } catch(e){} Audio2.mission(); }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
async function bootSequence(isReset = false) {
  if (state.booted && !isReset) return;
  state.booted = true;
  const seq = [
    ["[ SYS ] GÖLGE AĞI v2 başlatılıyor...", "sys", 14],
    ["[ OK ] Anonim kimlik doğrulandı.", "", 8],
    ["[ OK ] Tor zinciri aktif (3 atlama).", "", 8],
    ["[ OK ] Şifreli tünel hazır.", "", 8],
    ["[ OK ] Ses motoru hazır.", "", 8],
    ["[ OK ] Terminal hazır.", "ok", 8],
    ["", "", 0],
    ["Hoş geldin, GÖLGE.", "hl", 12],
    ["Görevleri SANA veriyoruz — sen yapıyorsun.", "info", 8],
    ["Adımları sırayla yaz. Yanlış komut sayılmaz.", "info", 8],
    ["", "", 0],
    ["Komutlar: 📖 SÖZLÜK (Shift+K)", "hl", 8],
    ["Görevler: 💼 GÖREVLER (Shift+J)", "hl", 8],
    ["Haberler: 📰 HABERLER (Shift+N)", "hl", 8],
    ["Rozetler: 🏆 ROZETLER (Shift+A) · Ses: Shift+S", "hl", 8],
    ["", "", 0],
  ];
  for (const [t, c, sp] of seq) {
    if (!t) { log(""); continue; }
    await logTyped(t, c, sp);
  }
  updateStats();
  await sleep(400);
  if (!state.inbox.filter(m => !m.done).length) {
    for (let i = 0; i < 3; i++) {
      const m = makeMission();
      if (m) { state.inbox.push(m); notifyMission(m); }
      await sleep(400);
    }
  }
  renderMissions();
  renderAch();
  if (!state.news.length) {
    addNews("mission", { title:"Karanlık ağda hareketlilik", desc:"Anonim gruplar aktive oldu" });
    addNews("mission", { title:"Polis siber birimi alarma geçti", desc:"Yeni saldırılar bekleniyor" });
  }
  scheduleSpawn(randInt(25000, 35000));
}

/* ============================================================
   BAŞLATMA
   ============================================================ */
renderDict();
renderAch();
updatePrompt();

const initAudioOnce = () => { try { Audio2.init(); Audio2.boot(); } catch(e) { console.warn("audio:", e); } };
document.addEventListener("click", initAudioOnce, { once: true });
document.addEventListener("keydown", initAudioOnce, { once: true });
document.addEventListener("touchstart", initAudioOnce, { once: true });

setTimeout(() => {
  try { bootSequence(); } catch(e) { console.error("boot:", e); }
  setTimeout(() => {
    if (!state.inbox.filter(m => !m.done).length) {
      for (let i = 0; i < 3; i++) {
        const m = makeMission();
        if (m) { state.inbox.push(m); notifyMission(m); }
      }
      renderMissions(); updateStats();
    }
  }, 3000);
}, 200);

setTimeout(() => hackInput.focus(), 600);
</script>
